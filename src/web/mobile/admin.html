<!DOCTYPE html>
<html lang="vi">
<head>
  <script>
    function checkRedirectBack() {
      if (!/Mobi|Android|iPhone/i.test(navigator.userAgent) && window.innerWidth >= 768) {
        window.location.replace("../admin/index.html" + window.location.search);
      }
    }
    checkRedirectBack();
    window.addEventListener('resize', checkRedirectBack);
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FallGuard AI - Mobile Admin</title>

<body>

  <!-- Bottom Sheet / Modal Backdrop -->
  <div class="modal-backdrop" id="modalBackdrop" onclick="if(event.target===this) closeModal()"></div>

  <script>
    function loadStore(key, fallback) {
      try { return JSON.parse(localStorage.getItem(key)) || fallback; } catch { return fallback; }
    }
    function saveStore(key, value) {
      localStorage.setItem(key, JSON.stringify(value));
    }

    // Default mock data matching desktop version
    let cameras = loadStore("fg_cameras", [
      { id: "CAM-001", name: "Camera phòng 101", ip: "192.168.1.101", rtsp: "rtsp://192.168.1.101/live", area: "Khu A", target: "BN-001", state: "normal", status: "online", fps: 30, resolution: "1920x1080", threshold: 78 },
      { id: "CAM-002", name: "Camera hành lang A", ip: "192.168.1.102", rtsp: "rtsp://192.168.1.102/live", area: "Khu A", target: "BN-002", state: "walking", status: "online", fps: 25, resolution: "1280x720", threshold: 76 },
      { id: "CAM-003", name: "Camera phòng 203", ip: "192.168.1.103", rtsp: "rtsp://192.168.1.103/live", area: "Khu B", target: "BN-003", state: "fallen", status: "online", fps: 30, resolution: "1920x1080", threshold: 82 },
      { id: "CAM-004", name: "Camera phòng phục hồi", ip: "192.168.1.104", rtsp: "rtsp://192.168.1.104/live", area: "Khu C", target: "BN-004", state: "sitting", status: "maintenance", fps: 20, resolution: "1280x720", threshold: 74 },
      { id: "CAM-005", name: "Camera phòng 305", ip: "192.168.1.105", rtsp: "rtsp://192.168.1.105/live", area: "Khu C", target: "BN-005", state: "normal", status: "offline", fps: 0, resolution: "1920x1080", threshold: 80 },
      { id: "CAM-006", name: "Camera phòng khách", ip: "192.168.1.106", rtsp: "rtsp://192.168.1.106/live", area: "Nhà riêng", target: "BN-006", state: "lying", status: "online", fps: 30, resolution: "1920x1080", threshold: 75 }
    ]);

    let alerts = loadStore("fg_alerts", [
      { id: "AL-20260615-001", time: "15/06/2026 16:22", camera: "CAM-003", person: "Nguyễn Văn Minh", confidence: 94, status: "Chưa xử lý", level: "Khẩn cấp", media: "Ảnh + video 12s" },
      { id: "AL-20260615-002", time: "15/06/2026 14:10", camera: "CAM-006", person: "Lê Thị Hoa", confidence: 81, status: "Đang xử lý", level: "Cao", media: "Ảnh" },
      { id: "AL-20260615-003", time: "15/06/2026 09:40", camera: "CAM-002", person: "Trần Văn An", confidence: 68, status: "Báo động giả", level: "Trung bình", media: "Video 8s" }
    ]);

    let users = loadStore("fg_users", [
      { email: "admin@nckh.vn", name: "Admin NCKH", role: "Admin", status: "Đang hoạt động", assignedCameras: ["CAM-001", "CAM-002", "CAM-003", "CAM-004", "CAM-005", "CAM-006"] },
      { email: "bao@nckh.vn", name: "Bảo", role: "Khachhang", status: "Đang hoạt động", assignedCameras: ["CAM-001", "CAM-002", "CAM-003", "CAM-004", "CAM-005", "CAM-006"] },
      { email: "nurse@nckh.vn", name: "Nhân", role: "Khachhang", status: "Đang hoạt động", assignedCameras: [] },
      { email: "family@nckh.vn", name: "Ân", role: "Khachhang", status: "Đang hoạt động", assignedCameras: [] },
      { email: "guest@nckh.vn", name: "Quân", role: "Khachhang", status: "Bị khóa", assignedCameras: [] }
    ]);

    let settings = loadStore("fg_settings", { confidence: 75, fall: 60, confirmSeconds: 3, storageGb: 50, retentionDays: 30, email: true, telegram: true, sms: false, zalo: false, cloud: true });
    let apiKeys = loadStore("fg_api_keys", [{ name: "Khu A IoT Gateway", desc: "Kết nối thiết bị báo động đầu giường", status: "Hoạt động", key: "fg_live_kpa_89237482" }]);
    let auditLogs = loadStore("fg_audit_logs", [{ time: "25/06/2026 09:12", user: "admin@nckh.vn", action: "Đăng nhập hệ thống", ip: "127.0.0.1" }]);

    let currentUser = { email: "admin@nckh.vn", name: "Admin", role: "Admin" };
    let authToken = localStorage.getItem("nckh_auth_token") || "";
    let isBackendOnline = false;
    let currentView = "dashboard";
    let selectedCameraId = cameras[0]?.id || "";
    let settingsSubView = ""; // Submenu selection in Settings tab ("" means menu list)
    
    // Live Streaming parameters
    let liveViewLevel = "locations"; // "locations", "cameras", "stream"
    let selectedLocation = "";
    let testCameraStream = null;
    let isPoseEstimating = false;
    let aiFallTestOn = false;

    // Media parameters
    let mediaViewLevel = "locations";
    let selectedMediaLocation = "";

    // Helper functions
    function $(id) { return document.getElementById(id); }
    function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
    function card(title, body) { return `<div class="card" style="padding:16px; margin-bottom:14px;"><h3 style="margin:0 0 12px; font-size:14px; font-weight:700; color:var(--muted);">${title}</h3>${body}</div>`; }
    function statusPill(status) {
      const v = String(status).toLowerCase();
      const cls = v.includes("online") || v.includes("hoạt động") || v.includes("đã xử lý") || v.includes("thành công") || v.includes("active") ? "green" : v.includes("khẩn") || v.includes("chưa") || v.includes("offline") || v.includes("khóa") || v.includes("fall") || v.includes("tắt") ? "red" : v.includes("đang") || v.includes("bảo trì") || v.includes("cao") || v.includes("warning") ? "amber" : "blue";
      return `<span class="pill ${cls}">${esc(status)}</span>`;
    }
    function apiBaseUrl() { return window.location.port === "5500" ? "http://127.0.0.1:8000" : window.location.origin; }

    function performLogout() {
      if (isBackendOnline && authToken) {
        fetch(`${apiBaseUrl()}/api/auth/logout`, { method: "POST", headers: { Authorization: `Bearer ${authToken}` } }).catch(() => {});
      }
      localStorage.removeItem("nckh_auth_token");
      localStorage.removeItem("nckh_current_user_email");
      window.location.replace("index.html");
    }

    async function checkBackendStatus() {
      try {
        const res = await fetch(`${apiBaseUrl()}/api/health`);
        if (res.ok) {
          isBackendOnline = true;
          const p = $("backendStatusPill");
          if (p) { p.textContent = "AI Online"; p.className = "pill green small"; }
          return true;
        }
      } catch (e) {}
      isBackendOnline = false;
      const p = $("backendStatusPill");
      if (p) { p.textContent = "Simulator"; p.className = "pill grey small"; }
      return false;
    }

    function saveAll() {
      saveStore("fg_cameras", cameras);
      saveStore("fg_alerts", alerts);
      saveStore("fg_users", users);
      saveStore("fg_settings", settings);
      saveStore("fg_api_keys", apiKeys);
      saveStore("fg_audit_logs", auditLogs);
      if (typeof monitoredProfile !== 'undefined') saveStore("fg_monitored_profile", monitoredProfile);
      if (typeof emergencyContacts !== 'undefined') saveStore("fg_emergency_contacts", emergencyContacts);
      if (typeof userNotifications !== 'undefined') saveStore("fg_user_notifications", userNotifications);
      if (typeof syncAppStateToBackend === 'function') {
        syncAppStateToBackend();
      }
    }

    async function syncAppStateFromBackend() {
      if (!isBackendOnline || !authToken) return;
      try {
        const res = await fetch(`${apiBaseUrl()}/api/appstate`, {
          headers: { Authorization: `Bearer ${authToken}` }
        });
        if (res.ok) {
          const data = await res.json();
          let changed = false;
          
          if (typeof apiKeys !== 'undefined' && data.api_keys_json) {
            const remote = JSON.parse(data.api_keys_json);
            if (JSON.stringify(remote) !== JSON.stringify(apiKeys)) {
              apiKeys = remote;
              saveStore("fg_api_keys", apiKeys);
              changed = true;
            }
          }
          if (typeof settings !== 'undefined' && data.settings_json) {
            const remote = JSON.parse(data.settings_json);
            if (JSON.stringify(remote) !== JSON.stringify(settings)) {
              settings = remote;
              saveStore("fg_settings", settings);
              changed = true;
            }
          }
          if (typeof monitoredProfile !== 'undefined' && data.monitored_profile_json) {
            const remote = JSON.parse(data.monitored_profile_json);
            if (JSON.stringify(remote) !== JSON.stringify(monitoredProfile)) {
              monitoredProfile = remote;
              saveStore("fg_monitored_profile", monitoredProfile);
              changed = true;
            }
          }
          if (typeof emergencyContacts !== 'undefined' && data.emergency_contacts_json) {
            const remote = JSON.parse(data.emergency_contacts_json);
            if (JSON.stringify(remote) !== JSON.stringify(emergencyContacts)) {
              emergencyContacts = remote;
              saveStore("fg_emergency_contacts", emergencyContacts);
              changed = true;
            }
          }
          if (typeof userNotifications !== 'undefined' && data.user_notifications_json) {
            const remote = JSON.parse(data.user_notifications_json);
            if (JSON.stringify(remote) !== JSON.stringify(userNotifications)) {
              userNotifications = remote;
              saveStore("fg_user_notifications", userNotifications);
              changed = true;
            }
          }
          
          if (changed && typeof render === 'function') {
            render(currentView, false);
          }
        }
      } catch (e) {
        console.error("Lỗi đồng bộ appstate từ backend:", e);
      }
    }

    async function syncAppStateToBackend() {
      if (!isBackendOnline || !authToken) return;
      try {
        const payload = {};
        if (typeof apiKeys !== 'undefined') payload.api_keys_json = JSON.stringify(apiKeys);
        if (typeof settings !== 'undefined') payload.settings_json = JSON.stringify(settings);
        if (typeof monitoredProfile !== 'undefined') payload.monitored_profile_json = JSON.stringify(monitoredProfile);
        if (typeof emergencyContacts !== 'undefined') payload.emergency_contacts_json = JSON.stringify(emergencyContacts);
        if (typeof userNotifications !== 'undefined') payload.user_notifications_json = JSON.stringify(userNotifications);
        
        await fetch(`${apiBaseUrl()}/api/appstate`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${authToken}`
          },
          body: JSON.stringify(payload)
        });
      } catch (e) {
        console.error("Lỗi đồng bộ appstate lên backend:", e);
      }
    }

    window.toggleSetting = function(key, checkbox) {
      settings[key] = checkbox.checked;
      saveAll();
    };

    window.connectTelegramBot = async function(btn) {
      if (!isBackendOnline || !authToken) {
        alert("Kết nối máy chủ AI ngoại tuyến.");
        return;
      }
      btn.disabled = true;
      const originalText = btn.textContent;
      btn.textContent = "Đang kết nối...";
      try {
        const res = await fetch(`${apiBaseUrl()}/api/telegram/connect`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${authToken}`
          }
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok && data.ok) {
          alert(`🎉 Kết nối thành công với Telegram của ${data.username}!`);
          settings.telegram = true;
          saveAll();
          render(currentView, false);
        } else {
          alert(data.detail || "Không thể kết nối Telegram Bot. Hãy nhắn tin bất kỳ cho Bot trước!");
        }
      } catch (e) {
        console.error(e);
        alert("Lỗi mạng khi kết nối Telegram Bot.");
      } finally {
        btn.disabled = false;
        btn.textContent = originalText;
      }
    };

    window.testNotificationChannel = async function(channelName, btn) {
      if (!isBackendOnline || !authToken) {
        alert("Không có kết nối với máy chủ AI.");
        return;
      }
      btn.disabled = true;
      try {
        const res = await fetch(`${apiBaseUrl()}/api/notifications/test`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${authToken}`
          },
          body: JSON.stringify({ channel: channelName })
        });
        const payload = await res.json().catch(() => ({}));
        if (res.ok && payload.ok) {
          alert(`🎉 ${payload.detail || 'Gửi tin nhắn test thành công!'}`);
        } else {
          alert(payload.detail || "Không thể gửi tin nhắn kiểm tra.");
        }
      } catch (err) {
        console.error(err);
        alert("Lỗi kết nối khi gửi thử.");
      } finally {
        btn.disabled = false;
      }
    };

    window.sendGeneralTestNotif = function(btn) {
      alert("Đã gửi thông báo thử qua Web, Email, Telegram, SMS và Zalo OA.");
    };

    window.changeMobileLogsPage = function(page) {
      window.mobileLogsPage = page;
      render("settings", false);
    };

    // Modal Control (Bottom Sheet)
    function openModal(title, body, footer = "") {
      const b = $("modalBackdrop");
      b.innerHTML = `
        <div class="modal animate-slide-up">
          <div class="modal-head">
            <h3>${title}</h3>
            <button onclick="closeModal()" style="background:none; border:none; font-size:16px; font-weight:bold; color:var(--muted);">✕</button>
          </div>
          <div class="modal-body">${body}</div>
          ${footer ? `<div class="modal-foot">${footer}</div>` : ""}
        </div>
      `;
      b.classList.add("open");
    }

    function closeModal() {
      $("modalBackdrop").classList.remove("open");
      stopTestCamera();
    }

    function selectCameraMobile(cameraId) {
      const cam = cameras.find(c => c.id === cameraId);
      if (cam) {
        if (cam.status === "offline") {
          alert(`Camera "${cam.name}" đang không hoạt động.`);
          return;
        }
        if (cam.status === "maintenance" || cam.status === "Bảo trì") {
          alert(`Camera "${cam.name}" đang trong thời gian bảo trì.`);
          return;
        }
      }
      selectedCameraId = cameraId;
      liveViewLevel = "stream";
      render("live", false);
      // Auto-start camera khi click vào camera card
      setTimeout(() => startTestCamera(), 150);
    }

    // Tab Switching
    function switchTab(viewName) {
      if (viewName !== "live") {
        stopTestCamera(true);
      } else {
        if (liveViewLevel === "stream") {
          stopTestCamera(true);
          liveViewLevel = "locations";
        }
      }
      currentView = viewName;
      if (viewName !== "settings") {
        settingsSubView = "";
      }
      document.querySelectorAll(".mobile-nav-item").forEach(item => {
        item.classList.toggle("active", item.dataset.view === viewName);
      });

      // Update drawer active state
      let activeDrawerId = `drawer-${viewName}`;
      if (viewName === "settings" && settingsSubView) {
        activeDrawerId = `drawer-${settingsSubView}`;
      }
      document.querySelectorAll(".menu-drawer-item").forEach(item => {
        item.classList.toggle("active", item.id === activeDrawerId);
      });

      render(viewName);
    }

    function openMenuDrawer() {
      $("menuDrawer").classList.add("open");
      $("menuDrawerBackdrop").classList.add("open");
    }

    function closeMenuDrawer() {
      $("menuDrawer").classList.remove("open");
      $("menuDrawerBackdrop").classList.remove("open");
    }

    function selectMenuView(viewName) {
      closeMenuDrawer();
      if (viewName === "dashboard") {
        switchTab("dashboard");
      } else if (viewName === "live") {
        liveViewLevel = "locations";
        switchTab("live");
      } else if (viewName === "alerts") {
        switchTab("alerts");
      } else if (viewName === "notifications") {
        currentView = "settings";
        settingsSubView = "notifications";
        switchTab("settings");
      } else if (viewName === "users" || viewName === "cameras" || viewName === "api" || viewName === "logs") {
        currentView = "settings";
        settingsSubView = viewName;
        if (viewName === "logs") window.mobileLogsPage = 1;
        switchTab("settings");
      } else if (viewName === "media") {
        currentView = "settings";
        settingsSubView = "media";
        mediaViewLevel = "locations";
        switchTab("settings");
      } else if (viewName === "settings") {
        currentView = "settings";
        settingsSubView = "system";
        switchTab("settings");
      }
    }

    function hasVideo(a) {
      if (!a) return false;
      const isMock = a.id === "AL-20260615-001" || a.id === "AL-20260615-002" || a.id === "AL-20260615-003";
      if (isMock) {
        return a.media && a.media.toLowerCase().includes("video");
      }
      if (a.cloud_video_url) return true;
      if (a.media && a.media.toLowerCase().includes("video")) return true;
      return false;
    }

    function getVisibleHouses() {
      const isPrivileged = currentUser.role === "Admin";
      if (isPrivileged) {
        const customerHouses = users
          .filter(u => u.role !== "Admin")
          .map(u => ({
            name: `Nhà ${u.name}`,
            ownerEmail: u.email,
            cameras: u.assignedCameras || []
          }));
          
        const assignedCamIds = new Set(users.filter(u => u.role !== "Admin").flatMap(u => u.assignedCameras || []));
        const unassignedCams = cameras.filter(c => !assignedCamIds.has(c.id));
        if (unassignedCams.length > 0) {
          customerHouses.push({
            name: "Thiết bị chưa gán",
            ownerEmail: "",
            cameras: unassignedCams.map(c => c.id)
          });
        }
        return customerHouses;
      } else {
        return [
          {
            name: `Nhà ${currentUser.name}`,
            ownerEmail: currentUser.email,
            cameras: currentUser.assignedCameras || []
          }
        ];
      }
    }

      if (view === "dashboard") {

      } else if (view === "live") {
        titleEl.textContent = "Giám sát camera";
        subEl.textContent = "Xem trực tiếp camera AI theo khu vực";
        contentEl.innerHTML = views.live();
        attachTestCameraStream();
      } else if (view === "alerts") {
        titleEl.textContent = "Cảnh báo ngã";
        subEl.textContent = "Danh sách cảnh báo té ngã";
        contentEl.innerHTML = views.alerts();
      } else if (view === "settings") {
        titleEl.textContent = settingsSubView === "" ? "Cấu hình" : getSubViewTitle(settingsSubView);
        subEl.textContent = settingsSubView === "" ? "Cấu hình tham số và quản lý danh sách" : "Chi tiết cấu hình hệ thống";

          if (window.mobileLogsPage > totalPages) window.mobileLogsPage = totalPages;

                      <div class="mobile-list-card-row">
                        <strong style="font-size:15px; color:var(--ink);">🏠 ${esc(h.name)}</strong>

    // API Form Handlers (Linked directly to modal onsubmit attributes)
    window.handleCameraFormSubmit = async function(event) {
      event.preventDefault();
      const form = event.target;
      const data = Object.fromEntries(new FormData(form).entries());
      if (!data.oldId && cameras.some(c => c.id.toLowerCase() === data.id.toLowerCase())) {
        alert("Mã camera này đã tồn tại trên hệ thống!");
        return;
      }
      
      const cam = { id: data.id, name: data.name, ip: data.ip, rtsp: data.rtsp, area: data.area, target: "", state: data.state, status: data.status, fps: Number(data.fps), resolution: data.resolution, threshold: Number(data.threshold) };
      
      if (isBackendOnline && authToken) {
        try {
          const url = data.oldId ? `${apiBaseUrl()}/api/cameras/${encodeURIComponent(data.oldId)}` : `${apiBaseUrl()}/api/cameras`;
          const method = data.oldId ? "PUT" : "POST";
          const res = await fetch(url, {
            method: method,
            headers: { "Content-Type": "application/json", Authorization: `Bearer ${authToken}` },
            body: JSON.stringify(cam)
          });
          if (!res.ok) {
            const errData = await res.json().catch(() => ({}));
            alert(errData.detail || "Không thể lưu camera lên máy chủ.");
            return;
          }
        } catch (e) {
          alert("Lỗi kết nối khi đồng bộ dữ liệu camera.");
          return;
        }
      }

      const idx = cameras.findIndex(c => c.id === data.oldId);
      if (idx >= 0) cameras[idx] = cam; else cameras.push(cam);
      saveAll();
      closeModal();
      render(currentView);
    };

    window.handleUserFormSubmit = async function(event) {
      event.preventDefault();
      const form = event.target;
      const formData = new FormData(form);
      const email = formData.get("email").trim();
      const oldEmail = formData.get("oldEmail");
      
      if (!oldEmail && users.some(u => u.email.toLowerCase() === email.toLowerCase())) {
        alert("Tài khoản với email này đã tồn tại!");
        return;
      }

      const assigned = formData.getAll("assignedCameras");
      const password = formData.get("password")?.trim();
      const user = {
        email: email,
        name: formData.get("name"),
        role: formData.get("role"),
        status: formData.get("status"),
        assignedCameras: assigned,
        phone: formData.get("phone")?.trim() || null
      };
      if (password) user.password = password;

      if (isBackendOnline && authToken) {
        try {
          const url = oldEmail ? `${apiBaseUrl()}/api/users/${encodeURIComponent(oldEmail)}` : `${apiBaseUrl()}/api/users`;
          const method = oldEmail ? "PUT" : "POST";
          const res = await fetch(url, {
            method: method,
            headers: { "Content-Type": "application/json", Authorization: `Bearer ${authToken}` },
            body: JSON.stringify(user)
          });
          if (!res.ok) {
            const errData = await res.json().catch(() => ({}));
            alert(errData.detail || "Không thể đồng bộ tài khoản.");
            return;
          }
        } catch (e) {
          alert("Lỗi kết nối khi đồng bộ tài khoản.");
          return;
        }
      }

      const idx = users.findIndex(u => u.email === oldEmail);
      const savedUser = { ...user };
      delete savedUser.password;
      if (idx >= 0) users[idx] = savedUser; else users.push(savedUser);
      saveAll();
      closeModal();
      render("settings");
    };

    window.handleSystemSettingsSubmit = async function(event) {
      event.preventDefault();
      const form = event.target;
      const data = Object.fromEntries(new FormData(form).entries());
      
      settings = {
        confidence: Number(data.confidence),
        fall: Number(data.fall),
        confirmSeconds: Number(data.confirmSeconds),
        storageGb: settings.storageGb,
        retentionDays: settings.retentionDays,
        email: Boolean(form.querySelector("[name='email']").checked),
        telegram: Boolean(form.querySelector("[name='telegram']").checked),
        sms: Boolean(form.querySelector("[name='sms']").checked),
        zalo: Boolean(form.querySelector("[name='zalo']").checked),
        cloud: Boolean(form.querySelector("[name='cloud']").checked),
      };

      saveAll();
      alert("Đã lưu cài đặt hệ thống thành công!");
      settingsSubView = "";
      render("settings");
    };

    // Actions
    function deleteCamera(id) {
      if (!confirm(`Xóa camera ${id}?`)) return;
      if (isBackendOnline && authToken) {
        fetch(`${apiBaseUrl()}/api/cameras/${encodeURIComponent(id)}`, { method: "DELETE", headers: { Authorization: `Bearer ${authToken}` } }).catch(() => {});
      }
      cameras = cameras.filter(c => c.id !== id);
      saveAll();
      render("settings");
    }

    function deleteUser(email) {
      if (email.toLowerCase() === currentUser.email.toLowerCase()) {
        alert("Bạn không thể tự xóa tài khoản của chính mình!");
        return;
      }
      if (!confirm(`Xóa tài khoản ${email}?`)) return;
      if (isBackendOnline && authToken) {
        fetch(`${apiBaseUrl()}/api/users/${encodeURIComponent(email)}`, { method: "DELETE", headers: { Authorization: `Bearer ${authToken}` } }).catch(() => {});

      users = users.filter(u => u.email !== email);
      saveAll();

        saveAll();
        render(currentView);
      }

        fetch(`${apiBaseUrl()}/api/alerts/${encodeURIComponent(id)}`, { method: "DELETE", headers: { Authorization: `Bearer ${authToken}` } }).catch(() => {});

    window.deleteSelectedAdminAlerts = async function() {
      const checkboxes = document.querySelectorAll(".admin-alert-checkbox:checked");

        alert("Vui lòng chọn ít nhất một cảnh báo để xóa.");

      if (!confirm(`Bạn có chắc chắn muốn xóa ${checkboxes.length} cảnh báo đã chọn? Hành động này sẽ xóa vĩnh viễn trên hệ thống.`)) {
        return;

      const ids = Array.from(checkboxes).map(cb => cb.dataset.id);
      if (isBackendOnline && authToken) {
        try {
          const res = await fetch(`${apiBaseUrl()}/api/alerts/delete-multiple`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${authToken}`
            },

          });
          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            alert(err.detail || "Lỗi khi xóa cảnh báo.");

          }
        } catch (e) {
          alert("Lỗi kết nối khi xóa cảnh báo.");

      apiKeys.push(newKey);
      saveAll();

    // Stream Estimation Logic (Pose Estimation / Camera utils)
    let cameraUtil = null;
    let localStream = null;

    function aiStreamUrl() {
      return `${apiBaseUrl()}/api/camera/stream.mjpg?token=${encodeURIComponent(authToken)}&ts=${Date.now()}`;
    }

    async function backendLogin(force = false) {
      if (authToken && !force) {
        try {
          const check = await fetch(`${apiBaseUrl()}/api/detection/status`, {
            headers: { Authorization: `Bearer ${authToken}` }
          });
          if (check.status === 401) {
            force = true;
          } else {
            return authToken;
          }
        } catch (e) {
          return authToken;
        }
      }
      
      const savedEmail = localStorage.getItem("nckh_current_user_email") || "admin@nckh.vn";
      const username = savedEmail;
      const password = "nckh2025";
      
      const res = await fetch(`${apiBaseUrl()}/api/auth/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password }),
      });
      if (res.ok) {
        const payload = await res.json();
        authToken = payload.token;
        localStorage.setItem("nckh_auth_token", authToken);
        return authToken;
      }
    }

    async function startTestCamera() {
      const video = $("testCameraVideo");
      const canvas = $("testCameraCanvas");
      const img = $("testCameraImg");
      const select = $("cameraModeSelect");
      const mode = select ? select.value : "client";

      if (mode === "client") {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          alert("Không thể mở camera trên trình duyệt qua kết nối HTTP không bảo mật (Safari yêu cầu HTTPS hoặc localhost để sử dụng Webcam). Vui lòng đổi nguồn sang 'Máy chủ (Webcam Server)' ở mục Điều khiển camera.");
          return;
        }
        img.style.display = "none";
        video.style.display = "block";
        canvas.style.display = "block";

        try {
          localStream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: "user" } });
          video.srcObject = localStream;
          video.play();
          
          isPoseEstimating = true;
          startPoseEstimator(video, canvas);
        } catch (e) {
          alert("Không thể mở Webcam trên điện thoại: " + e.message);
        }
      } else {
        // Server mode
        video.style.display = "none";
        canvas.style.display = "none";
        img.style.display = "block";
        
        try {
          await backendLogin();
          const cam = cameras.find(c => c.id === selectedCameraId);
          const res = await fetch(`${apiBaseUrl()}/api/control/start`, {
            method: "POST",
            headers: { "Content-Type": "application/json", Authorization: `Bearer ${authToken}` },
            body: JSON.stringify({ source: (cam && cam.rtsp) ? cam.rtsp : "0", camera_id: selectedCameraId }),
          });
          const payload = await res.json().catch(() => ({}));
          if (!res.ok && res.status !== 409) {
            throw new Error(payload.detail || "Không khởi động được camera trên AI backend.");
          }
          img.src = aiStreamUrl();
        } catch (err) {
          alert("Lỗi Backend: " + (err.message || err));
        }
      }
    }

    function stopTestCamera(stopBackend = false) {
      isPoseEstimating = false;
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }
      const video = $("testCameraVideo");
      if (video) {
        video.srcObject = null;
        video.style.display = "none";
      }
      const canvas = $("testCameraCanvas");
      if (canvas) {
        canvas.style.display = "none";
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
      const img = $("testCameraImg");
      if (img) {
        img.removeAttribute("src");
        img.style.display = "none";
      }

      if (stopBackend && isBackendOnline && authToken) {
        fetch(`${apiBaseUrl()}/api/control/stop`, {
          method: "POST",
          headers: { Authorization: `Bearer ${authToken}` },
        }).catch(() => {});
      }
    }

    function toggleStreamMode() {
      stopTestCamera();
      setTimeout(() => startTestCamera(), 150);
    }

    function toggleFallTest() {
      aiFallTestOn = !aiFallTestOn;
      const b = $("liveStateBadge");
      if (b) {
        b.textContent = aiFallTestOn ? "FALL DETECTED" : "NORMAL";
        b.className = aiFallTestOn ? "pill red" : "pill green";
      }
    }

    function snapshotTestCamera() {
      alert("Đã chụp ảnh kiểm tra hệ thống và tải lên Cloudinary!");
    }

    // MediaPipe Pose Logic implementation
    function startPoseEstimator(video, canvas) {
      const ctx = canvas.getContext("2d");
      const pose = new Pose({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
      });

      pose.setOptions({
        modelComplexity: 1,
        smoothLandmarks: true,
        enableSegmentation: false,
        smoothSegmentation: false,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });

      pose.onResults((results) => {
        if (!isPoseEstimating) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Draw landmarks
        if (results.poseLandmarks) {
          // Draw connecting skeleton
          drawConnectors(ctx, results.poseLandmarks, POSE_CONNECTIONS, { color: '#00FF00', lineWidth: 2 });
          drawLandmarks(ctx, results.poseLandmarks, { color: '#FF0000', lineWidth: 1, radius: 3 });
        }
      });

      async function detectionFrame() {
        if (!isPoseEstimating) return;
        if (video.readyState >= 2) {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          await pose.send({ image: video });
        }
        requestAnimationFrame(detectionFrame);
      }
      
      video.addEventListener('loadeddata', () => {
        detectionFrame();
      });
    }

      // Dynamic hook runs after DOM is rendered
    }

      // Stub
    }

    // Init session checks
    async function syncFromBackend() {
      if (!isBackendOnline || !authToken) return;
      try {
        const [cRes, aRes, lRes] = await Promise.all([
          fetch(`${apiBaseUrl()}/api/cameras`, { headers: { Authorization: `Bearer ${authToken}` } }),
          fetch(`${apiBaseUrl()}/api/alerts`, { headers: { Authorization: `Bearer ${authToken}` } }),
          fetch(`${apiBaseUrl()}/api/logs`, { headers: { Authorization: `Bearer ${authToken}` } })
        ]);
        
        let changed = false;
        if (cRes.ok) {
          const c = await cRes.json();
          if (c && Array.isArray(c)) {
            if (JSON.stringify(c) !== JSON.stringify(cameras)) {
              cameras = c;
              saveStore("fg_cameras", cameras);
              changed = true;
            }
          }
        }
        if (aRes.ok) {
          const a = await aRes.json();
          if (a && a.alerts && Array.isArray(a.alerts)) {
            if (JSON.stringify(a.alerts) !== JSON.stringify(alerts)) {
              alerts = a.alerts;
              saveStore("fg_alerts", alerts);
              changed = true;
            }
          }
        }
        if (lRes.ok) {
          const l = await lRes.json();
          if (l && l.logs && Array.isArray(l.logs)) {
            if (JSON.stringify(l.logs) !== JSON.stringify(auditLogs)) {
              auditLogs = l.logs;
              saveStore("fg_audit_logs", auditLogs);
              changed = true;
            }
          }
        }
        
        await syncAppStateFromBackend();
        
        if (changed) {
          render(currentView, false);
        }
      } catch (e) {
        console.error("Lỗi đồng bộ:", e);
      }
    }

    async function initAdminApp() {
      await checkBackendStatus();
      
      // Load current user
      const savedEmail = localStorage.getItem("nckh_current_user_email") || "admin@nckh.vn";
      const u = users.find(x => x.email.toLowerCase() === savedEmail.toLowerCase());
      if (u) {
        currentUser = u;
        $("headerUserName").textContent = u.name;
      }
      
      // Fetch dynamic backend list if connected
      if (isBackendOnline && authToken) {
        await syncAppStateFromBackend();
        
        Promise.all([
          fetch(`${apiBaseUrl()}/api/cameras`, { headers: { Authorization: `Bearer ${authToken}` } }).then(r => r.ok ? r.json() : null),
          fetch(`${apiBaseUrl()}/api/users`, { headers: { Authorization: `Bearer ${authToken}` } }).then(r => r.ok ? r.json() : null),
          fetch(`${apiBaseUrl()}/api/alerts`, { headers: { Authorization: `Bearer ${authToken}` } }).then(r => r.ok ? r.json() : null),
          fetch(`${apiBaseUrl()}/api/logs`, { headers: { Authorization: `Bearer ${authToken}` } }).then(r => r.ok ? r.json() : null)
        ]).then(([c, usr, a, l]) => {
          if (c && Array.isArray(c)) { cameras = c; saveStore("fg_cameras", cameras); }
          if (usr && Array.isArray(usr)) { users = usr; saveStore("fg_users", users); }
          if (a && a.alerts && Array.isArray(a.alerts)) { alerts = a.alerts; saveStore("fg_alerts", alerts); }
          if (l && l.logs && Array.isArray(l.logs)) { auditLogs = l.logs; saveStore("fg_audit_logs", auditLogs); }
          render(currentView, false);
        }).catch(() => {});
      }
      
      render("dashboard", false);
      
      // Periodically sync camera and alerts data in the background
      setInterval(syncFromBackend, 4000);
    }

    window.onload = initAdminApp;
  </script>
