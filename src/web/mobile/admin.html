<!DOCTYPE html>
<html lang="vi">
<head>
  <script>
    function checkRedirectBack() {
      if (!/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) && window.innerWidth >= 768) {
        window.location.replace("../admin.html" + window.location.search);
      }
    }
    checkRedirectBack();
    window.addEventListener('resize', checkRedirectBack);
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FallGuard AI - Mobile Admin</title>
  <link rel="stylesheet" href="mobile.css" />
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
</head>
<body>
  <section class="app" id="app">
    <header class="header">
      <div style="display: flex; align-items: center; gap: 8px;">
        <button class="hamburger-btn" onclick="openMenuDrawer()">☰</button>
        <span style="font-weight: 850; font-size: 18px; color: var(--blue);">FG Admin</span>
        <span class="pill blue small" id="backendStatusPill" style="font-size: 10px; padding: 2px 6px;">AI Backend</span>
      </div>
      <div class="user">
        <span id="headerUserName" style="font-size: 12px; font-weight: 600;">Admin</span>
        <button onclick="performLogout()" style="background: none; border: none; font-size: 16px; padding: 4px; cursor: pointer;" title="Đăng xuất">🚪</button>
      </div>
    </header>

    <main class="main" style="flex: 1; overflow-y: auto;">
      <div style="margin-bottom: 12px;">
        <h2 id="pageTitle" style="margin: 0; font-size: 20px; font-weight: 800; color: var(--ink);">Dashboard</h2>
        <p id="pageSub" class="hint" style="margin: 4px 0 0 0; font-size: 12px; color: var(--muted);">Thống kê tổng quan camera và khách hàng</p>
      </div>
      
      <div id="content">
        <!-- View Content Injected Here -->
      </div>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="mobile-nav">
      <button class="mobile-nav-item active" data-view="dashboard" onclick="switchTab('dashboard')">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
        <span>Trang chủ</span>
      </button>
      <button class="mobile-nav-item" data-view="live" onclick="switchTab('live')">
        <svg viewBox="0 0 24 24"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
        <span>Giám sát</span>
      </button>
      <button class="mobile-nav-item" data-view="alerts" onclick="switchTab('alerts')">
        <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span>Cảnh báo</span>
      </button>
      <button class="mobile-nav-item" data-view="settings" onclick="switchTab('settings')">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>Cấu hình</span>
      </button>
    </nav>
  </section>

  <!-- Sidebar Menu Drawer (for mobile screen) -->
  <div class="menu-drawer-backdrop" id="menuDrawerBackdrop" onclick="closeMenuDrawer()"></div>
  <div class="menu-drawer" id="menuDrawer">
    <div class="menu-drawer-header">
      <div class="menu-drawer-title">FallGuard AI</div>
      <button class="menu-drawer-close" onclick="closeMenuDrawer()">✕</button>
    </div>
    <div class="menu-drawer-content">
      
      <div>
        <div class="menu-drawer-group-title">TỔNG QUAN</div>
        <div class="menu-drawer-items">
          <button class="menu-drawer-item active" id="drawer-dashboard" onclick="selectMenuView('dashboard')">
            <span class="num">01</span> Dashboard
          </button>
        </div>
      </div>
      
      <div>
        <div class="menu-drawer-group-title">VẬN HÀNH</div>
        <div class="menu-drawer-items">
          <button class="menu-drawer-item" id="drawer-live" onclick="selectMenuView('live')">
            <span class="num">02</span> Nơi lắp đặt
          </button>
          <button class="menu-drawer-item" id="drawer-alerts" onclick="selectMenuView('alerts')">
            <span class="num">03</span> Hệ thống cảnh báo
          </button>
          <button class="menu-drawer-item" id="drawer-notifications" onclick="selectMenuView('notifications')">
            <span class="num">04</span> Thông báo
          </button>
        </div>
      </div>
      
      <div>
        <div class="menu-drawer-group-title">QUẢN LÝ</div>
        <div class="menu-drawer-items">
          <button class="menu-drawer-item" id="drawer-users" onclick="selectMenuView('users')">
            <span class="num">05</span> Danh sách khách hàng
          </button>
          <button class="menu-drawer-item" id="drawer-media" onclick="selectMenuView('media')">
            <span class="num">06</span> Hình ảnh & video
          </button>
          <button class="menu-drawer-item" id="drawer-cameras" onclick="selectMenuView('cameras')">
            <span class="num">07</span> Quản lý camera
          </button>
        </div>
      </div>
      
      <div>
        <div class="menu-drawer-group-title">HỆ THỐNG</div>
        <div class="menu-drawer-items">
          <button class="menu-drawer-item" id="drawer-settings" onclick="selectMenuView('settings')">
            <span class="num">08</span> Cài đặt hệ thống
          </button>
          <button class="menu-drawer-item" id="drawer-api" onclick="selectMenuView('api')">
            <span class="num">09</span> API Management
          </button>
          <button class="menu-drawer-item" id="drawer-logs" onclick="selectMenuView('logs')">
            <span class="num">10</span> Lịch sử đăng nhập
          </button>
        </div>
      </div>

    </div>
  </div>

  <!-- Bottom Sheet / Modal Backdrop -->
  <div class="modal-backdrop" id="modalBackdrop" onclick="if(event.target===this) closeModal()"></div>

  <script>
    function loadStore(key, fallback) {
      try { return JSON.parse(localStorage.getItem(key)) || fallback; } catch { return fallback; }
    }
    function saveStore(key, value) {
      localStorage.setItem(key, JSON.stringify(value));
    }

    // Default mock data matching desktop version
    let cameras = loadStore("fg_cameras", [
      { id: "CAM-001", name: "Camera phòng 101", ip: "192.168.1.101", rtsp: "rtsp://192.168.1.101/live", area: "Khu A", target: "BN-001", state: "normal", status: "online", fps: 30, resolution: "1920x1080", threshold: 78 },
      { id: "CAM-002", name: "Camera hành lang A", ip: "192.168.1.102", rtsp: "rtsp://192.168.1.102/live", area: "Khu A", target: "BN-002", state: "walking", status: "online", fps: 25, resolution: "1280x720", threshold: 76 },
      { id: "CAM-003", name: "Camera phòng 203", ip: "192.168.1.103", rtsp: "rtsp://192.168.1.103/live", area: "Khu B", target: "BN-003", state: "fallen", status: "online", fps: 30, resolution: "1920x1080", threshold: 82 },
      { id: "CAM-004", name: "Camera phòng phục hồi", ip: "192.168.1.104", rtsp: "rtsp://192.168.1.104/live", area: "Khu C", target: "BN-004", state: "sitting", status: "maintenance", fps: 20, resolution: "1280x720", threshold: 74 },
      { id: "CAM-005", name: "Camera phòng 305", ip: "192.168.1.105", rtsp: "rtsp://192.168.1.105/live", area: "Khu C", target: "BN-005", state: "normal", status: "offline", fps: 0, resolution: "1920x1080", threshold: 80 },
      { id: "CAM-006", name: "Camera phòng khách", ip: "192.168.1.106", rtsp: "rtsp://192.168.1.106/live", area: "Nhà riêng", target: "BN-006", state: "lying", status: "online", fps: 30, resolution: "1920x1080", threshold: 75 }
    ]);

    let alerts = loadStore("fg_alerts", [
      { id: "AL-20260615-001", time: "15/06/2026 16:22", camera: "CAM-003", person: "Nguyễn Văn Minh", confidence: 94, status: "Chưa xử lý", level: "Khẩn cấp", media: "Ảnh + video 12s" },
      { id: "AL-20260615-002", time: "15/06/2026 14:10", camera: "CAM-006", person: "Lê Thị Hoa", confidence: 81, status: "Đang xử lý", level: "Cao", media: "Ảnh" },
      { id: "AL-20260615-003", time: "15/06/2026 09:40", camera: "CAM-002", person: "Trần Văn An", confidence: 68, status: "Báo động giả", level: "Trung bình", media: "Video 8s" }
    ]);

    let users = loadStore("fg_users", [
      { email: "admin@nckh.vn", name: "Admin NCKH", role: "Admin", status: "Đang hoạt động", assignedCameras: ["CAM-001", "CAM-002", "CAM-003", "CAM-004", "CAM-005", "CAM-006"] },
      { email: "bao@nckh.vn", name: "Bảo", role: "Khachhang", status: "Đang hoạt động", assignedCameras: ["CAM-001", "CAM-002", "CAM-003", "CAM-004", "CAM-005", "CAM-006"] },
      { email: "nurse@nckh.vn", name: "Nhân", role: "Khachhang", status: "Đang hoạt động", assignedCameras: [] },
      { email: "family@nckh.vn", name: "Ân", role: "Khachhang", status: "Đang hoạt động", assignedCameras: [] },
      { email: "guest@nckh.vn", name: "Quân", role: "Khachhang", status: "Bị khóa", assignedCameras: [] }
    ]);

    let settings = loadStore("fg_settings", { confidence: 75, fall: 60, confirmSeconds: 3, storageGb: 50, retentionDays: 30, email: true, telegram: true, sms: false, zalo: false, cloud: true });
    let apiKeys = loadStore("fg_api_keys", [{ name: "Khu A IoT Gateway", desc: "Kết nối thiết bị báo động đầu giường", status: "Hoạt động", key: "fg_live_kpa_89237482" }]);
    let auditLogs = loadStore("fg_audit_logs", [{ time: "25/06/2026 09:12", user: "admin@nckh.vn", action: "Đăng nhập hệ thống", ip: "127.0.0.1" }]);

    let currentUser = { email: "admin@nckh.vn", name: "Admin", role: "Admin" };
    let authToken = localStorage.getItem("nckh_auth_token") || "";
    let isBackendOnline = false;
    let currentView = "dashboard";
    let selectedCameraId = cameras[0]?.id || "";
    let settingsSubView = ""; // Submenu selection in Settings tab ("" means menu list)
    
    // Live Streaming parameters
    let liveViewLevel = "locations"; // "locations", "cameras", "stream"
    let selectedLocation = "";
    let testCameraStream = null;
    let isPoseEstimating = false;
    let aiFallTestOn = false;

    // Media parameters
    let mediaViewLevel = "locations";
    let selectedMediaLocation = "";

    // Helper functions
    function $(id) { return document.getElementById(id); }
    function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
    function card(title, body) { return `<div class="card" style="padding:16px; margin-bottom:14px;"><h3 style="margin:0 0 12px; font-size:14px; font-weight:700; color:var(--muted);">${title}</h3>${body}</div>`; }
    function statusPill(status) {
      const cls = status === "online" || status === "Đang hoạt động" || status === "Hoạt động" || status === "ĐANG CHẠY" || status === "NORMAL" || status === "WALKING" || status === "SITTING" || status === "LYING" ? "green" : status === "Bảo trì" || status === "maintenance" || status === "Đang xử lý" || status === "Warning" ? "amber" : "red";
      return `<span class="pill ${cls}">${esc(status)}</span>`;
    }
    function apiBaseUrl() { return window.location.port === "5500" ? "http://127.0.0.1:8000" : window.location.origin; }

    function performLogout() {
      if (isBackendOnline && authToken) {
        fetch(`${apiBaseUrl()}/api/auth/logout`, { method: "POST", headers: { Authorization: `Bearer ${authToken}` } }).catch(() => {});
      }
      localStorage.removeItem("nckh_auth_token");
      localStorage.removeItem("nckh_current_user_email");
      window.location.replace("index.html");
    }

    async function checkBackendStatus() {
      try {
        const res = await fetch(`${apiBaseUrl()}/api/health`);
        if (res.ok) {
          isBackendOnline = true;
          const p = $("backendStatusPill");
          if (p) { p.textContent = "AI Online"; p.className = "pill green small"; }
          return true;
        }
      } catch (e) {}
      isBackendOnline = false;
      const p = $("backendStatusPill");
      if (p) { p.textContent = "Simulator"; p.className = "pill grey small"; }
      return false;
    }

    function saveAll() {
      saveStore("fg_cameras", cameras);
      saveStore("fg_alerts", alerts);
      saveStore("fg_users", users);
      saveStore("fg_settings", settings);
      saveStore("fg_api_keys", apiKeys);
      saveStore("fg_audit_logs", auditLogs);
    }

    // Modal Control (Bottom Sheet)
    function openModal(title, body, footer = "") {
      const b = $("modalBackdrop");
      b.innerHTML = `
        <div class="modal animate-slide-up">
          <div class="modal-head">
            <h3>${title}</h3>
            <button onclick="closeModal()" style="background:none; border:none; font-size:16px; font-weight:bold; color:var(--muted);">✕</button>
          </div>
          <div class="modal-body">${body}</div>
          ${footer ? `<div class="modal-foot">${footer}</div>` : ""}
        </div>
      `;
      b.classList.add("open");
    }

    function closeModal() {
      $("modalBackdrop").classList.remove("open");
      stopTestCamera();
    }

    // Tab Switching
    function switchTab(viewName) {
      currentView = viewName;
      if (viewName !== "settings") {
        settingsSubView = "";
      }
      document.querySelectorAll(".mobile-nav-item").forEach(item => {
        item.classList.toggle("active", item.dataset.view === viewName);
      });

      // Update drawer active state
      let activeDrawerId = `drawer-${viewName}`;
      if (viewName === "settings" && settingsSubView) {
        activeDrawerId = `drawer-${settingsSubView}`;
      }
      document.querySelectorAll(".menu-drawer-item").forEach(item => {
        item.classList.toggle("active", item.id === activeDrawerId);
      });

      render(viewName);
    }

    function openMenuDrawer() {
      $("menuDrawer").classList.add("open");
      $("menuDrawerBackdrop").classList.add("open");
    }

    function closeMenuDrawer() {
      $("menuDrawer").classList.remove("open");
      $("menuDrawerBackdrop").classList.remove("open");
    }

    function selectMenuView(viewName) {
      closeMenuDrawer();
      if (viewName === "dashboard") {
        switchTab("dashboard");
      } else if (viewName === "live") {
        liveViewLevel = "locations";
        switchTab("live");
      } else if (viewName === "alerts") {
        switchTab("alerts");
      } else if (viewName === "notifications") {
        currentView = "settings";
        settingsSubView = "system";
        switchTab("settings");
      } else if (viewName === "users" || viewName === "cameras" || viewName === "api" || viewName === "logs") {
        currentView = "settings";
        settingsSubView = viewName;
        switchTab("settings");
      } else if (viewName === "media") {
        currentView = "settings";
        settingsSubView = "media";
        mediaViewLevel = "locations";
        switchTab("settings");
      } else if (viewName === "settings") {
        currentView = "settings";
        settingsSubView = "system";
        switchTab("settings");
      }
    }

    function hasVideo(a) {
      if (!a) return false;
      const isMock = a.id === "AL-20260615-001" || a.id === "AL-20260615-002" || a.id === "AL-20260615-003";
      if (isMock) {
        return a.media && a.media.toLowerCase().includes("video");
      }
      if (a.cloud_video_url) return true;
      if (a.media && a.media.toLowerCase().includes("video")) return true;
      return false;
    }

    function getVisibleHouses() {
      const isPrivileged = currentUser.role === "Admin";
      if (isPrivileged) {
        const customerHouses = users
          .filter(u => u.role !== "Admin")
          .map(u => ({
            name: `Nhà ${u.name}`,
            ownerEmail: u.email,
            cameras: u.assignedCameras || []
          }));
          
        const assignedCamIds = new Set(users.filter(u => u.role !== "Admin").flatMap(u => u.assignedCameras || []));
        const unassignedCams = cameras.filter(c => !assignedCamIds.has(c.id));
        if (unassignedCams.length > 0) {
          customerHouses.push({
            name: "Thiết bị chưa gán",
            ownerEmail: "",
            cameras: unassignedCams.map(c => c.id)
          });
        }
        return customerHouses;
      } else {
        return [
          {
            name: `Nhà ${currentUser.name}`,
            ownerEmail: currentUser.email,
            cameras: currentUser.assignedCameras || []
          }
        ];
      }
    }

    function render(view, sync = true) {
      if (sync) checkBackendStatus();
      
      const titleEl = $("pageTitle");
      const subEl = $("pageSub");
      const contentEl = $("content");

      // Update page header info
      if (view === "dashboard") {
        titleEl.textContent = "Trang chủ";
        subEl.textContent = "Thống kê tổng quan hệ thống";
        contentEl.innerHTML = views.dashboard();
      } else if (view === "live") {
        titleEl.textContent = "Giám sát camera";
        subEl.textContent = "Xem trực tiếp camera AI theo khu vực";
        contentEl.innerHTML = views.live();
        attachTestCameraStream();
      } else if (view === "alerts") {
        titleEl.textContent = "Cảnh báo ngã";
        subEl.textContent = "Danh sách cảnh báo té ngã";
        contentEl.innerHTML = views.alerts();
      } else if (view === "settings") {
        titleEl.textContent = settingsSubView === "" ? "Cấu hình" : getSubViewTitle(settingsSubView);
        subEl.textContent = settingsSubView === "" ? "Cấu hình tham số và quản lý danh sách" : "Chi tiết cấu hình hệ thống";
        contentEl.innerHTML = views.settings();
      }
    }

    function getSubViewTitle(sv) {
      const m = { "system": "Cài đặt hệ thống", "users": "Quản lý tài khoản", "cameras": "Quản lý Camera", "api": "Quản lý API Key", "logs": "Lịch sử hệ thống", "media": "Hình ảnh & video" };
      return m[sv] || "Cấu hình";
    }

    const views = {
      dashboard: () => {
        const total = cameras.length;
        const active = cameras.filter(c => c.status === "online").length;
        const inactive = cameras.filter(c => c.status === "offline").length;
        const pend = alerts.filter(a => a.status === "Chưa xử lý").length;

        return `
          <div class="grid kpis" style="margin-bottom:14px;">
            <div class="kpi card">
              <span class="ico blue flex center val-center" style="background:rgba(79, 70, 229, 0.1); color:var(--blue); font-weight:bold;">CAM</span>
              <div class="kpi-value">${total}</div>
              <div class="hint" style="font-size:10px;">Camera kết nối</div>
            </div>
            <div class="kpi card">
              <span class="ico green flex center val-center" style="background:rgba(16, 185, 129, 0.1); color:var(--green); font-weight:bold;">ON</span>
              <div class="kpi-value">${active}</div>
              <div class="hint" style="font-size:10px;">Hoạt động</div>
            </div>
            <div class="kpi card">
              <span class="ico red flex center val-center" style="background:rgba(244, 63, 94, 0.1); color:var(--red); font-weight:bold;">OFF</span>
              <div class="kpi-value">${inactive}</div>
              <div class="hint" style="font-size:10px;">Lỗi mạng</div>
            </div>
            <div class="kpi card">
              <span class="ico amber flex center val-center" style="background:rgba(245, 158, 11, 0.1); color:var(--amber); font-weight:bold;">AL</span>
              <div class="kpi-value">${pend}</div>
              <div class="hint" style="font-size:10px;">Chờ xử lý</div>
            </div>
          </div>

          ${card("Trạng thái AI Realtime", `
            <div class="mobile-list-card-row">
              <span>Hệ thống AI:</span>
              <strong>${isBackendOnline ? statusPill("Hoạt động") : statusPill("Simulator")}</strong>
            </div>
            <div class="mobile-list-card-row" style="margin-top:10px;">
              <span>Máy chủ phát hiện:</span>
              <strong style="color:var(--blue); font-family:monospace;">${esc(apiBaseUrl())}</strong>
            </div>
          `)}

          ${card("Cảnh báo khẩn cấp gần đây", `
            <div class="mobile-list">
              ${alerts.slice(0, 3).map(a => `
                <div class="mobile-list-card" onclick="viewAlertMediaModal('${esc(a.id)}')">
                  <div class="mobile-list-card-row">
                    <span class="mobile-list-card-title" style="color:var(--red);">⚠️ Té ngã!</span>
                    <span style="font-size:11px; color:var(--muted);">${esc(a.time)}</span>
                  </div>
                  <div class="mobile-list-card-row">
                    <span style="font-size:13px;">Thiết bị: <strong>${esc(a.camera)}</strong></span>
                    <span>${statusPill(a.status)}</span>
                  </div>
                </div>
              `).join("")}
            </div>
            <button class="btn line block" onclick="switchTab('alerts')" style="width:100%; margin-top:12px; height:38px;">Xem tất cả cảnh báo</button>
          `)}
        `;
      },

      live: () => {
        // Location-based folders -> Cameras list -> Streaming View
        const houses = Array.from(new Set(cameras.map(c => c.area || "Khác")));
        
        if (liveViewLevel === "locations") {
          return `

                    <button class="btn small line" onclick="cameraModal('${esc(c.id)}')">Sửa</button>
                    <button class="btn small danger" onclick="deleteCamera('${esc(c.id)}')">Xóa</button>
                  </div>

                ${houses.map(h => {

    function cameraModal(id = "") {

          </div>
        </form>
      `, `
        <button type="button" class="btn line" onclick="closeModal()">Hủy</button>
        <button type="submit" form="cameraFormReal" class="btn primary">Lưu camera</button>
      `);

      const u = email ? (users.find(item => item.email === email) || {}) : {};

      const assigned = u.assignedCameras || [];

    // API Form Handlers (Linked directly to modal onsubmit attributes)
    window.handleCameraFormSubmit = async function(event) {
      event.preventDefault();
      const form = event.target;
      const data = Object.fromEntries(new FormData(form).entries());
      if (!data.oldId && cameras.some(c => c.id.toLowerCase() === data.id.toLowerCase())) {
        alert("Mã camera này đã tồn tại trên hệ thống!");
        return;
      }
      
      const cam = { id: data.id, name: data.name, ip: data.ip, rtsp: data.rtsp, area: data.area, target: "", state: data.state, status: data.status, fps: Number(data.fps), resolution: data.resolution, threshold: Number(data.threshold) };
      
      if (isBackendOnline && authToken) {
        try {
          const url = data.oldId ? `${apiBaseUrl()}/api/cameras/${encodeURIComponent(data.oldId)}` : `${apiBaseUrl()}/api/cameras`;
          const method = data.oldId ? "PUT" : "POST";
          const res = await fetch(url, {
            method: method,
            headers: { "Content-Type": "application/json", Authorization: `Bearer ${authToken}` },
            body: JSON.stringify(cam)
          });
          if (!res.ok) {
            const errData = await res.json().catch(() => ({}));
            alert(errData.detail || "Không thể lưu camera lên máy chủ.");
            return;
          }
        } catch (e) {
          alert("Lỗi kết nối khi đồng bộ dữ liệu camera.");
          return;
        }
      }

      const idx = cameras.findIndex(c => c.id === data.oldId);
      if (idx >= 0) cameras[idx] = cam; else cameras.push(cam);
      saveAll();
      closeModal();
      render(currentView);
    };

    window.handleUserFormSubmit = async function(event) {
      event.preventDefault();
      const form = event.target;
      const formData = new FormData(form);
      const email = formData.get("email").trim();
      const oldEmail = formData.get("oldEmail");
      
      if (!oldEmail && users.some(u => u.email.toLowerCase() === email.toLowerCase())) {
        alert("Tài khoản với email này đã tồn tại!");
        return;
      }

      const assigned = formData.getAll("assignedCameras");
      const password = formData.get("password")?.trim();
      const user = {
        email: email,
        name: formData.get("name"),
        role: formData.get("role"),
        status: formData.get("status"),
        assignedCameras: assigned,
        phone: formData.get("phone")?.trim() || null
      };
      if (password) user.password = password;

      if (isBackendOnline && authToken) {
        try {
          const url = oldEmail ? `${apiBaseUrl()}/api/users/${encodeURIComponent(oldEmail)}` : `${apiBaseUrl()}/api/users`;
          const method = oldEmail ? "PUT" : "POST";
          const res = await fetch(url, {
            method: method,
            headers: { "Content-Type": "application/json", Authorization: `Bearer ${authToken}` },
            body: JSON.stringify(user)
          });
          if (!res.ok) {
            const errData = await res.json().catch(() => ({}));
            alert(errData.detail || "Không thể đồng bộ tài khoản.");
            return;
          }
        } catch (e) {
          alert("Lỗi kết nối khi đồng bộ tài khoản.");
          return;
        }
      }

      const idx = users.findIndex(u => u.email === oldEmail);
      const savedUser = { ...user };
      delete savedUser.password;
      if (idx >= 0) users[idx] = savedUser; else users.push(savedUser);
      saveAll();
      closeModal();
      render("settings");
    };

    window.handleSystemSettingsSubmit = async function(event) {
      event.preventDefault();
      const form = event.target;
      const data = Object.fromEntries(new FormData(form).entries());
      
      settings = {
        confidence: Number(data.confidence),
        fall: Number(data.fall),

        storageGb: settings.storageGb,

        email: Boolean(form.querySelector("[name='email']").checked),
        telegram: Boolean(form.querySelector("[name='telegram']").checked),
        sms: Boolean(form.querySelector("[name='sms']").checked),
        zalo: Boolean(form.querySelector("[name='zalo']").checked),
        cloud: Boolean(form.querySelector("[name='cloud']").checked),
      };

      saveAll();
      alert("Đã lưu cài đặt hệ thống thành công!");

    };

      if (!confirm(`Xóa tài khoản ${email}?`)) return;
      if (isBackendOnline && authToken) {
        fetch(`${apiBaseUrl()}/api/users/${encodeURIComponent(email)}`, { method: "DELETE", headers: { Authorization: `Bearer ${authToken}` } }).catch(() => {});

    // Stream Estimation Logic (Pose Estimation / Camera utils)
    let cameraUtil = null;
    let localStream = null;

    async function startTestCamera() {
      const video = $("testCameraVideo");
      const canvas = $("testCameraCanvas");
      const img = $("testCameraImg");
      const select = $("cameraModeSelect");
      const mode = select ? select.value : "client";

      if (mode === "client") {
        img.style.display = "none";
        video.style.display = "block";
        canvas.style.display = "block";

        try {
          localStream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: "user" } });
          video.srcObject = localStream;
          video.play();
          
          isPoseEstimating = true;
          startPoseEstimator(video, canvas);
        } catch (e) {
          alert("Không thể mở Webcam trên điện thoại: " + e.message);
        }
      } else {
        // Server mode
        video.style.display = "none";
        canvas.style.display = "none";
        img.style.display = "block";
        img.src = `${apiBaseUrl()}/api/control/stream?t=${Date.now()}`;
      }
    }

    function stopTestCamera() {
      isPoseEstimating = false;
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }
      const video = $("testCameraVideo");
      if (video) video.srcObject = null;
      const img = $("testCameraImg");
      if (img) img.src = "";
    }

    function toggleStreamMode() {
      stopTestCamera();
    }

    function toggleFallTest() {
      aiFallTestOn = !aiFallTestOn;
      const b = $("liveStateBadge");
      if (b) {
        b.textContent = aiFallTestOn ? "FALL DETECTED" : "NORMAL";
        b.className = aiFallTestOn ? "pill red" : "pill green";
      }
    }

    function snapshotTestCamera() {

    }

    // MediaPipe Pose Logic implementation
    function startPoseEstimator(video, canvas) {
      const ctx = canvas.getContext("2d");
      const pose = new Pose({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
      });

      pose.setOptions({
        modelComplexity: 1,
        smoothLandmarks: true,
        enableSegmentation: false,
        smoothSegmentation: false,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });

      pose.onResults((results) => {
        if (!isPoseEstimating) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Draw landmarks
        if (results.poseLandmarks) {
          // Draw connecting skeleton
          drawConnectors(ctx, results.poseLandmarks, POSE_CONNECTIONS, { color: '#00FF00', lineWidth: 2 });
          drawLandmarks(ctx, results.poseLandmarks, { color: '#FF0000', lineWidth: 1, radius: 3 });
        }
      });

      async function detectionFrame() {
        if (!isPoseEstimating) return;
        if (video.readyState >= 2) {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          await pose.send({ image: video });
        }
        requestAnimationFrame(detectionFrame);
      }
      
      video.addEventListener('loadeddata', () => {
        detectionFrame();
      });
    }

    // Init session checks
    async function initAdminApp() {
      await checkBackendStatus();
      
      // Load current user
      const savedEmail = localStorage.getItem("nckh_current_user_email") || "admin@nckh.vn";
      const u = users.find(x => x.email.toLowerCase() === savedEmail.toLowerCase());
      if (u) {
        currentUser = u;
        $("headerUserName").textContent = u.name;
      }
      
      // Fetch dynamic backend list if connected
      if (isBackendOnline && authToken) {
        Promise.all([
          fetch(`${apiBaseUrl()}/api/cameras`, { headers: { Authorization: `Bearer ${authToken}` } }).then(r => r.ok ? r.json() : null),
          fetch(`${apiBaseUrl()}/api/users`, { headers: { Authorization: `Bearer ${authToken}` } }).then(r => r.ok ? r.json() : null),
          fetch(`${apiBaseUrl()}/api/alerts`, { headers: { Authorization: `Bearer ${authToken}` } }).then(r => r.ok ? r.json() : null),
        ]).then(([c, usr, a]) => {
          if (c && Array.isArray(c)) { cameras = c; saveStore("fg_cameras", cameras); }
          if (usr && Array.isArray(usr)) { users = usr; saveStore("fg_users", users); }
          if (a && a.alerts && Array.isArray(a.alerts)) { alerts = a.alerts; saveStore("fg_alerts", alerts); }
          render(currentView, false);
        }).catch(() => {});
      }
      
      render("dashboard", false);
    }

    window.onload = initAdminApp;
