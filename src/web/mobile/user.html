<!DOCTYPE html>
<html lang="vi">
<head>
  <script>
    function checkRedirectBack() {
      if (!/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) && window.innerWidth >= 768) {
        window.location.replace("../user.html" + window.location.search);
      }
    }
    checkRedirectBack();
    window.addEventListener('resize', checkRedirectBack);
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FallGuard AI - Mobile User</title>
  <link rel="stylesheet" href="mobile.css" />
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
</head>
<body>
  <section class="app" id="app">
    <header class="header">
      <div style="display: flex; align-items: center; gap: 8px;">
        <button class="hamburger-btn" onclick="openMenuDrawer()">☰</button>
        <span style="font-weight: 850; font-size: 18px; color: var(--blue);">FG Client</span>
        <span class="pill green small" id="backendStatusPill" style="font-size: 10px; padding: 2px 6px;">AI Online</span>
      </div>
      <div class="user">
        <span id="headerUserName" style="font-size: 12px; font-weight: 600;">Khách hàng</span>
        <button onclick="performLogout()" style="background: none; border: none; font-size: 16px; padding: 4px; cursor: pointer;" title="Đăng xuất">🚪</button>
      </div>
    </header>

    <main class="main" style="flex: 1; overflow-y: auto;">
      <div style="margin-bottom: 12px;">
        <h2 id="pageTitle" style="margin: 0; font-size: 20px; font-weight: 800; color: var(--ink);">Dashboard</h2>
        <p id="pageSub" class="hint" style="margin: 4px 0 0 0; font-size: 12px; color: var(--muted);">Giám sát camera được phân quyền</p>
      </div>
      
      <div id="content">
        <!-- View Content Injected Here -->
      </div>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="mobile-nav">
      <button class="mobile-nav-item active" data-view="dashboard" onclick="switchTab('dashboard')">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
        <span>Trang chủ</span>
      </button>
      <button class="mobile-nav-item" data-view="alerts" onclick="switchTab('alerts')">
        <svg viewBox="0 0 24 24"><path d="M12 2L1 21h22L12 2zm0 4l7.5 13h-15L12 6zm-1 3v4h2V9h-2zm0 6v2h2v-2h-2z"/></svg>
        <span>Cảnh báo</span>
      </button>
      <button class="mobile-nav-item" data-view="notifications" onclick="switchTab('notifications')">
        <svg viewBox="0 0 24 24"><path d="M12 22a2 2 0 0 0 2-2h-4a2 2 0 0 0 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4a1.5 1.5 0 0 0-3 0v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
        <span>Thông báo</span>
      </button>
      <button class="mobile-nav-item" data-view="profile" onclick="switchTab('profile')">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>Hồ sơ</span>
      </button>
    </nav>
  </section>

  <!-- Sidebar Menu Drawer (for mobile screen) -->
  <div class="menu-drawer-backdrop" id="menuDrawerBackdrop" onclick="closeMenuDrawer()"></div>
  <div class="menu-drawer" id="menuDrawer">
    <div class="menu-drawer-header">
      <div class="menu-drawer-title">FallGuard AI</div>
      <button class="menu-drawer-close" onclick="closeMenuDrawer()">✕</button>
    </div>
    <div class="menu-drawer-content">
      
      <div>
        <div class="menu-drawer-group-title">TỔNG QUAN</div>
        <div class="menu-drawer-items">
          <button class="menu-drawer-item active" id="drawer-dashboard" onclick="selectMenuView('dashboard')">
            🏠 Trang chủ
          </button>
        </div>
      </div>
      
      <div>
        <div class="menu-drawer-group-title">GIÁM SÁT</div>
        <div class="menu-drawer-items">
          <button class="menu-drawer-item" id="drawer-alerts" onclick="selectMenuView('alerts')">
            ⚠️ Danh sách cảnh báo
          </button>
        </div>
      </div>
      
      <div>
        <div class="menu-drawer-group-title">CÁ NHÂN & LIÊN HỆ</div>
        <div class="menu-drawer-items">
          <button class="menu-drawer-item" id="drawer-contacts" onclick="selectMenuView('contacts')">
            📞 Liên hệ khẩn cấp
          </button>
          <button class="menu-drawer-item" id="drawer-notifications" onclick="selectMenuView('notifications')">
            🔔 Thông báo
          </button>
          <button class="menu-drawer-item" id="drawer-profile" onclick="selectMenuView('profile')">
            ⚙️ Thông tin cá nhân
          </button>
        </div>
      </div>

    </div>
    
    <!-- Sidebar Footer (User Info & Logout) -->
    <div class="menu-drawer-footer" id="menuDrawerFooter"></div>
  </div>

  <!-- Bottom Sheet / Modal Backdrop -->
  <div class="modal-backdrop" id="modalBackdrop" onclick="if(event.target===this) closeModal()"></div>

  <script>
    function loadStore(key, fallback) {
      try { return JSON.parse(localStorage.getItem(key)) || fallback; } catch { return fallback; }
    }
    function saveStore(key, value) {
      localStorage.setItem(key, JSON.stringify(value));
    }

    let cameras = loadStore("fg_cameras", [
      { id: "CAM-001", name: "Camera phòng 101", ip: "192.168.1.101", rtsp: "rtsp://192.168.1.101/live", area: "Khu A", target: "BN-001", state: "normal", status: "online", fps: 30, resolution: "1920x1080", threshold: 78 },
      { id: "CAM-002", name: "Camera hành lang A", ip: "192.168.1.102", rtsp: "rtsp://192.168.1.102/live", area: "Khu A", target: "BN-002", state: "walking", status: "online", fps: 25, resolution: "1280x720", threshold: 76 },
      { id: "CAM-003", name: "Camera phòng 203", ip: "192.168.1.103", rtsp: "rtsp://192.168.1.103/live", area: "Khu B", target: "BN-003", state: "fallen", status: "online", fps: 30, resolution: "1920x1080", threshold: 82 },
      { id: "CAM-004", name: "Camera phòng phục hồi", ip: "192.168.1.104", rtsp: "rtsp://192.168.1.104/live", area: "Khu C", target: "BN-004", state: "sitting", status: "maintenance", fps: 20, resolution: "1280x720", threshold: 74 },
      { id: "CAM-005", name: "Camera phòng 305", ip: "192.168.1.105", rtsp: "rtsp://192.168.1.105/live", area: "Khu C", target: "BN-005", state: "normal", status: "offline", fps: 0, resolution: "1920x1080", threshold: 80 },
      { id: "CAM-006", name: "Camera phòng khách", ip: "192.168.1.106", rtsp: "rtsp://192.168.1.106/live", area: "Nhà riêng", target: "BN-006", state: "lying", status: "online", fps: 30, resolution: "1920x1080", threshold: 75 }
    ]);

    let alerts = loadStore("fg_alerts", [
      { id: "AL-20260615-001", time: "15/06/2026 16:22", camera: "CAM-003", person: "Nguyễn Văn Minh", confidence: 94, status: "Chưa xử lý", level: "Khẩn cấp", media: "Ảnh + video 12s" },
      { id: "AL-20260615-002", time: "15/06/2026 14:10", camera: "CAM-006", person: "Lê Thị Hoa", confidence: 81, status: "Đang xử lý", level: "Cao", media: "Ảnh" },
      { id: "AL-20260615-003", time: "15/06/2026 09:40", camera: "CAM-002", person: "Trần Văn An", confidence: 68, status: "Báo động giả", level: "Trung bình", media: "Video 8s" }
    ]);

    let users = loadStore("fg_users", [
      { email: "bao@nckh.vn", name: "Bảo", role: "Khachhang", status: "Đang hoạt động", assignedCameras: ["CAM-001", "CAM-002", "CAM-003", "CAM-004", "CAM-005", "CAM-006"] }
    ]);

    let monitoredProfile = loadStore("fg_monitored_profile", { name: "Nguyễn Văn Minh", age: 72, gender: "Nam", address: "Phòng 203, Khu B", emergencyContact: "Bảo (Con trai) - 0912345678" });
    let emergencyContacts = loadStore("fg_emergency_contacts", [{ name: "Lê Thị Hoa", relationship: "Con gái", phone: "0987654321", email: "hoa@nckh.vn" }]);

    let userNotifications = loadStore("fg_user_notifications", [
      { id: "NT-001", type: "fall", title: "Cảnh báo ngã khẩn cấp", content: "Phát hiện té ngã tại Camera phòng 203 lúc 16:22 ngày 15/06/2026.", time: "15/06/2026 16:22", read: false },
      { id: "NT-002", type: "disconnect", title: "Camera mất kết nối", content: "Camera phòng 305 đã mất kết nối lúc 13:00 ngày 15/06/2026.", time: "15/06/2026 13:00", read: true },
      { id: "NT-003", type: "maintenance", title: "Hội hệ thống bảo trì", content: "Hệ thống FallGuard AI sẽ tiến hành bảo trì nâng cấp thuật toán từ 01:00 đến 03:00 ngày 20/06/2026.", time: "14/06/2026 18:00", read: true }
    ]);

    let currentUser = { email: "bao@nckh.vn", name: "Đinh Ngọc Thế Nhân", role: "Khachhang", assignedCameras: ["CAM-001", "CAM-002", "CAM-003", "CAM-004", "CAM-005", "CAM-006"] };
    let authToken = localStorage.getItem("nckh_auth_token") || "";
    let isBackendOnline = false;
    let currentView = "dashboard";
    let selectedCameraId = "";
    
    // Live stream control
    let liveViewLevel = "locations"; // "locations", "cameras", "stream"
    let selectedLocation = "";
    let localStream = null;
    let isPoseEstimating = false;
    let aiFallTestOn = false;

    // Helpers
    function $(id) { return document.getElementById(id); }
    function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
    function card(title, body) { return `<div class="card" style="padding:16px; margin-bottom:14px;"><h3 style="margin:0 0 12px; font-size:14px; font-weight:700; color:var(--muted);">${title}</h3>${body}</div>`; }
    function statusPill(status) {
      const cls = status === "online" || status === "Đang hoạt động" || status === "Hoạt động" || status === "ĐANG CHẠY" || status === "NORMAL" || status === "WALKING" || status === "SITTING" || status === "LYING" ? "green" : status === "Bảo trì" || status === "maintenance" || status === "Đang xử lý" || status === "Warning" ? "amber" : "red";
      return `<span class="pill ${cls}">${esc(status)}</span>`;
    }
    function apiBaseUrl() { return window.location.port === "5500" ? "http://127.0.0.1:8000" : window.location.origin; }

    function getInitials(name) {
      if (!name) return "US";
      const words = name.trim().split(/\s+/);
      if (words.length === 1) return words[0].substring(0, 2).toUpperCase();
      const first = words[0].charAt(0);
      const last = words[words.length - 1].charAt(0);
      return (first + last).toUpperCase();
    }

    function formatRole(role) {
      if (!role) return "User (Khách hàng)";
      if (role.toLowerCase() === "admin") return "Quản trị viên";
      if (role.toLowerCase() === "khachhang" || role.toLowerCase() === "user" || role.toLowerCase() === "khách hàng") return "User (Khách hàng)";
      return role;
    }

    function updateDrawerFooter() {
      const footerEl = $("menuDrawerFooter");
      if (!footerEl) return;
      const name = currentUser.name || "Khách hàng";
      const initials = getInitials(name);
      const displayRole = formatRole(currentUser.role);
      
      footerEl.innerHTML = `
        <div class="menu-drawer-user-info">
          <div class="menu-drawer-avatar">${esc(initials)}</div>
          <div class="menu-drawer-user-detail">
            <span class="menu-drawer-user-name">${esc(name)}</span>
            <span class="menu-drawer-user-role">${esc(displayRole)}</span>
          </div>
        </div>
        <button class="menu-drawer-logout-btn" onclick="performLogout()">Đăng xuất</button>
      `;
    }

    function performLogout() {
      if (isBackendOnline && authToken) {
        fetch(`${apiBaseUrl()}/api/auth/logout`, { method: "POST", headers: { Authorization: `Bearer ${authToken}` } }).catch(() => {});
      }
      localStorage.removeItem("nckh_auth_token");
      localStorage.removeItem("nckh_current_user_email");
      window.location.replace("index.html");
    }

    async function checkBackendStatus() {
      try {
        const res = await fetch(`${apiBaseUrl()}/api/health`);
        if (res.ok) {
          isBackendOnline = true;
          const p = $("backendStatusPill");
          if (p) { p.textContent = "AI Online"; p.className = "pill green small"; }
          return true;
        }
      } catch (e) {}
      isBackendOnline = false;
      const p = $("backendStatusPill");
      if (p) { p.textContent = "Simulator"; p.className = "pill grey small"; }
      return false;
    }

    function saveAll() {
      saveStore("fg_monitored_profile", monitoredProfile);
      saveStore("fg_emergency_contacts", emergencyContacts);
      saveStore("fg_user_notifications", userNotifications);
      if (typeof syncAppStateToBackend === 'function') {
        syncAppStateToBackend();
      }
    }

    async function syncAppStateFromBackend() {
      if (!isBackendOnline || !authToken) return;
      try {
        const res = await fetch(`${apiBaseUrl()}/api/appstate`, {
          headers: { Authorization: `Bearer ${authToken}` }
        });
        if (res.ok) {
          const data = await res.json();
          let changed = false;
          
          if (typeof monitoredProfile !== 'undefined' && data.monitored_profile_json) {
            const remote = JSON.parse(data.monitored_profile_json);
            if (JSON.stringify(remote) !== JSON.stringify(monitoredProfile)) {
              monitoredProfile = remote;
              saveStore("fg_monitored_profile", monitoredProfile);
              changed = true;
            }
          }
          if (typeof emergencyContacts !== 'undefined' && data.emergency_contacts_json) {
            const remote = JSON.parse(data.emergency_contacts_json);
            if (JSON.stringify(remote) !== JSON.stringify(emergencyContacts)) {
              emergencyContacts = remote;
              saveStore("fg_emergency_contacts", emergencyContacts);
              changed = true;
            }
          }
          if (typeof userNotifications !== 'undefined' && data.user_notifications_json) {
            const remote = JSON.parse(data.user_notifications_json);
            if (JSON.stringify(remote) !== JSON.stringify(userNotifications)) {
              userNotifications = remote;
              saveStore("fg_user_notifications", userNotifications);
              changed = true;
            }
          }
          
          if (changed && typeof render === 'function') {
            render(currentView, false);
          }
        }
      } catch (e) {
        console.error("Lỗi đồng bộ appstate từ backend:", e);
      }
    }

    async function syncAppStateToBackend() {
      if (!isBackendOnline || !authToken) return;
      try {
        const payload = {};
        if (typeof monitoredProfile !== 'undefined') payload.monitored_profile_json = JSON.stringify(monitoredProfile);
        if (typeof emergencyContacts !== 'undefined') payload.emergency_contacts_json = JSON.stringify(emergencyContacts);
        if (typeof userNotifications !== 'undefined') payload.user_notifications_json = JSON.stringify(userNotifications);
        
        await fetch(`${apiBaseUrl()}/api/appstate`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${authToken}`
          },
          body: JSON.stringify(payload)
        });
      } catch (e) {
        console.error("Lỗi đồng bộ appstate lên backend:", e);
      }
    }

    function selectCameraMobile(cameraId) {
      const cam = cameras.find(c => c.id === cameraId);
      if (cam) {
        if (cam.status === "offline") {
          alert(`Camera "${cam.name}" đang không hoạt động.`);
          return;
        }
        if (cam.status === "maintenance" || cam.status === "Bảo trì") {
          alert(`Camera "${cam.name}" đang trong thời gian bảo trì.`);
          return;
        }
      }
      selectedCameraId = cameraId;
      liveViewLevel = "stream";
      switchTab("live");
    }

    function aiStreamUrl() {
      return `${apiBaseUrl()}/api/camera/stream.mjpg?token=${encodeURIComponent(authToken)}&ts=${Date.now()}`;
    }

    async function backendLogin(force = false) {
      if (authToken && !force) {
        try {
          const check = await fetch(`${apiBaseUrl()}/api/detection/status`, {
            headers: { Authorization: `Bearer ${authToken}` }
          });
          if (check.status === 401) {
            force = true;
          } else {
            return authToken;
          }
        } catch (e) {
          return authToken;
        }
      }
      
      const savedEmail = localStorage.getItem("nckh_current_user_email") || "bao@nckh.vn";
      const username = savedEmail;
      const password = "nckh2025";
      
      const res = await fetch(`${apiBaseUrl()}/api/auth/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password }),
      });
      const payload = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(payload.detail || "Không đăng nhập được backend AI.");
      authToken = payload.token;
      localStorage.setItem("nckh_auth_token", authToken);
      return authToken;
    }

    // Modal Control (Bottom Sheet)
    function openModal(title, body, footer = "") {
      const b = $("modalBackdrop");
      b.innerHTML = `
        <div class="modal animate-slide-up">
          <div class="modal-head">
            <h3>${title}</h3>
            <button onclick="closeModal()" style="background:none; border:none; font-size:16px; font-weight:bold; color:var(--muted);">✕</button>
          </div>
          <div class="modal-body">${body}</div>
          ${footer ? `<div class="modal-foot">${footer}</div>` : ""}
        </div>
      `;
      b.classList.add("open");
    }

    function closeModal() {
      $("modalBackdrop").classList.remove("open");
      stopTestCamera();
    }

    // Tab view logic
    function switchTab(viewName) {
      currentView = viewName;
      document.querySelectorAll(".mobile-nav-item").forEach(item => {
        const targetView = item.dataset.view;
        if (viewName === 'live') {
          item.classList.toggle("active", targetView === 'dashboard');
        } else {
          item.classList.toggle("active", targetView === viewName);
        }
      });

      // Sync drawer item highlight
      let activeDrawerId = `drawer-${viewName}`;
      document.querySelectorAll(".menu-drawer-item").forEach(item => {
        item.classList.toggle("active", item.id === activeDrawerId);
      });

      render(viewName);
    }

    function openMenuDrawer() {
      $("menuDrawer").classList.add("open");
      $("menuDrawerBackdrop").classList.add("open");
    }

    function closeMenuDrawer() {
      $("menuDrawer").classList.remove("open");
      $("menuDrawerBackdrop").classList.remove("open");
    }

    function selectMenuView(viewName) {
      closeMenuDrawer();
      if (viewName === "dashboard") {
        switchTab("dashboard");
      } else if (viewName === "live") {
        liveViewLevel = "locations";
        switchTab("live");
      } else if (viewName === "alerts") {
        switchTab("alerts");
      } else if (viewName === "profile" || viewName === "contacts") {
        switchTab("profile");
        if (viewName === "contacts") {
          setTimeout(() => {
            const cards = document.querySelectorAll(".card");
            if (cards.length >= 2) cards[1].scrollIntoView({ behavior: "smooth" });
          }, 100);
        }
      } else if (viewName === "notifications") {
        switchTab("notifications");
      }
    }

    function toggleReadNotification(idx) {
      if (userNotifications[idx]) {
        userNotifications[idx].read = !userNotifications[idx].read;
        saveAll();
        render(currentView);
      }
    }

    function deleteNotification(idx) {
      if (confirm("Xóa thông báo này?")) {
        userNotifications.splice(idx, 1);
        saveAll();
        render(currentView);
      }
    }

    function markAllNotificationsAsRead() {
      userNotifications.forEach(n => n.read = true);
      saveAll();
      render(currentView);
    }

    function hasVideo(a) {
      if (!a) return false;
      const isMock = a.id === "AL-20260615-001" || a.id === "AL-20260615-002" || a.id === "AL-20260615-003";
      if (isMock) {
        return a.media && a.media.toLowerCase().includes("video");
      }
      if (a.cloud_video_url) return true;
      if (a.media && a.media.toLowerCase().includes("video")) return true;
      return false;
    }

    // Filter cameras permitted to current user
    function getVisibleCameras() {
      return cameras.filter(c => (currentUser.assignedCameras || []).includes(c.id));
    }

    function render(view, sync = true) {
      if (sync) checkBackendStatus();
      
      const titleEl = $("pageTitle");
      const subEl = $("pageSub");
      const contentEl = $("content");

      if (view === "dashboard") {
        titleEl.textContent = "Trang chủ";
        subEl.textContent = "Trạng thái các thiết bị bảo vệ người thân";
        contentEl.innerHTML = views.dashboard();
      } else if (view === "live") {
        titleEl.textContent = "Giám sát Camera";
        subEl.textContent = "Nhận luồng hình ảnh trực tiếp từ AI";
        contentEl.innerHTML = views.live();
      } else if (view === "alerts") {
        titleEl.textContent = "Cảnh báo ngã";
        subEl.textContent = "Nhật ký cảnh báo té ngã";
        contentEl.innerHTML = views.alerts();
      } else if (view === "profile") {
        titleEl.textContent = "Hồ sơ";
        subEl.textContent = "Cập nhật hồ sơ bệnh nhân và liên hệ";
        contentEl.innerHTML = views.profile();
      } else if (view === "notifications") {
        titleEl.textContent = "Thông báo";
        subEl.textContent = "Danh sách thông báo hệ thống";
        contentEl.innerHTML = views.notifications();
      }
    }

    const views = {
      dashboard: () => {
        const visCams = getVisibleCameras();

        return `
          ${card("Camera trực tiếp", `
            <div class="mobile-list">
              ${visCams.map(c => `
                <div class="mobile-list-card" onclick="selectCameraMobile('${c.id}')">
                  <div class="mobile-list-card-row">
                    <strong style="color:var(--ink); font-size:13px;">${esc(c.name)}</strong>
                    <span>${statusPill(c.status)}</span>
                  </div>
                  <div style="font-size:11px; color:var(--muted); display:flex; justify-content:space-between; align-items:center;">
                    <span>Nhãn AI: <strong>${c.state.toUpperCase()}</strong></span>
                    <span style="color:var(--blue); font-weight:bold;">Nhấn để xem live →</span>
                  </div>
                </div>

    // Submit handlers
    window.handleEditProfileSubmit = function(event) {
      event.preventDefault();
      const form = event.target;
      const data = Object.fromEntries(new FormData(form).entries());
      monitoredProfile = {
        name: data.name,
        age: Number(data.age),
        gender: data.gender,
        address: data.address,
        emergencyContact: data.emergencyContact
      };
      saveAll();
      closeModal();
      render("dashboard");
    };

    window.handleAddContactSubmit = function(event) {
      event.preventDefault();
      const form = event.target;
      const data = Object.fromEntries(new FormData(form).entries());
      emergencyContacts.push({
        name: data.name,
        relationship: data.relationship,
        phone: data.phone,
        email: data.email
      });
      saveAll();
      closeModal();
      render("profile");
    };

    window.handleEditContactSubmit = function(event, index) {
      event.preventDefault();
      const form = event.target;
      const data = Object.fromEntries(new FormData(form).entries());
      emergencyContacts[index] = {
        name: data.name,
        relationship: data.relationship,
        phone: data.phone,
        email: data.email
      };
      saveAll();
      closeModal();
      render("profile");
    };


    window.handleUserProfileSubmit = async function(event) {
      event.preventDefault();
      const form = event.target;
      const data = Object.fromEntries(new FormData(form).entries());
      
      const oldEmail = currentUser.email;
      const newEmail = data.email.trim().toLowerCase();
      
      if (!newEmail.includes("@")) {
        alert("Email không hợp lệ.");
        return;
      }

      const updatedUser = {
        ...currentUser,
        name: data.name.trim(),
        email: newEmail,
        phone: data.phone.trim() || null
      };

      if (isBackendOnline && authToken) {
        try {
          const res = await fetch(`${apiBaseUrl()}/api/users/${encodeURIComponent(oldEmail)}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json", Authorization: `Bearer ${authToken}` },
            body: JSON.stringify(updatedUser)
          });
          if (!res.ok) {
            const errData = await res.json().catch(() => ({}));
            alert(errData.detail || "Không thể đồng bộ thay đổi thông tin.");
            return;
          }
        } catch (e) {
          alert("Lỗi kết nối khi đồng bộ thay đổi thông tin.");
          return;
        }
      }

      currentUser = updatedUser;
      localStorage.setItem("nckh_current_user_email", newEmail);
      $("headerUserName").textContent = currentUser.name;
      updateDrawerFooter();
      alert("Đã lưu thông tin liên lạc thành công!");
      render("profile");
    };

    window.handleChangePasswordSubmit = async function(event) {
      event.preventDefault();
      const form = event.target;
      const data = Object.fromEntries(new FormData(form).entries());

      if (data.newPassword !== data.confirmPassword) {
        alert("Xác nhận mật khẩu mới không khớp!");
        return;
      }

      const updatedUser = {
        ...currentUser,
        password: data.newPassword
      };

      if (isBackendOnline && authToken) {
        try {
          const res = await fetch(`${apiBaseUrl()}/api/users/${encodeURIComponent(currentUser.email)}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json", Authorization: `Bearer ${authToken}` },
            body: JSON.stringify(updatedUser)
          });
          if (!res.ok) {
            const errData = await res.json().catch(() => ({}));
            alert(errData.detail || "Không thể đồng bộ đổi mật khẩu.");
            return;
          }
        } catch (e) {
          alert("Lỗi kết nối khi đổi mật khẩu.");
          return;
        }
      }

      alert("Đã đổi mật khẩu tài khoản thành công!");
      form.reset();
    };

        } else {
          mediaHtml = `
            <img src="${imgSrc}" alt="Snapshot" style="width:100%; border-radius:8px; border:1px solid var(--line); aspect-ratio:16/9; object-fit:cover;" onerror="this.style.display='none'; document.getElementById('mediaDeleteNote-${id}').style.display='block';">
            <div id="mediaDeleteNote-${id}" style="display:none; padding:30px 10px; text-align:center; background:#f8fafc; border-radius:8px; border:1px solid var(--line);">
              <div style="font-size:32px; margin-bottom:8px;">🗑️</div>
              <p style="font-weight:600; margin:0 0 4px; color:var(--red); font-size:13px;">Hình ảnh không khả dụng</p>
              <p class="hint" style="margin:0; font-size:11px;">Nội dung này đã bị xóa trên Cloudinary.</p>
            </div>
          `;
        }
      }
      
      openModal(`Chi tiết té ngã ${id}`, `
        ${mediaHtml}
        ${cloudLinkHtml}
        <div class="mobile-list-card-detail" style="font-size:13px; margin-top:12px; border-top:1px solid var(--line); padding-top:8px; display:flex; flex-direction:column; gap:4px;">
          <div>Mã cảnh báo: <strong>${a.id}</strong></div>
          <div>Thời gian: <strong>${a.time}</strong></div>
          <div>Camera phòng: <strong>${a.camera}</strong></div>
          <div>Bệnh nhân: <strong>${a.person}</strong></div>
          <div>Độ tin cậy: <strong>${a.confidence}%</strong></div>
          <div>Trạng thái: <strong>${a.status}</strong></div>
        </div>
      `, `<button class="btn line" onclick="closeModal()">Đóng</button>`);
    }

    // Camera Livestream Control
    async function startTestCamera() {
      const video = $("testCameraVideo");
      const canvas = $("testCameraCanvas");
      const img = $("testCameraImg");
      const select = $("cameraModeSelect");
      const mode = select ? select.value : "client";

      if (mode === "client") {
        img.style.display = "none";
        video.style.display = "block";
        canvas.style.display = "block";

        try {
          localStream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: "user" } });
          video.srcObject = localStream;
          video.play();
          
          isPoseEstimating = true;
          startPoseEstimator(video, canvas);
        } catch (e) {
          alert("Không thể mở Webcam: " + e.message);
        }
      } else {
        video.style.display = "none";
        canvas.style.display = "none";
        img.style.display = "block";
        
        try {
          await backendLogin();
          const res = await fetch(`${apiBaseUrl()}/api/control/start`, {
            method: "POST",
            headers: { "Content-Type": "application/json", Authorization: `Bearer ${authToken}` },
            body: JSON.stringify({ source: "0", camera_id: selectedCameraId }),
          });
          const payload = await res.json().catch(() => ({}));
          if (!res.ok && res.status !== 409) {
            throw new Error(payload.detail || "Không khởi động được camera trên AI backend.");
          }
          img.src = aiStreamUrl();
        } catch (err) {
          alert("Lỗi Backend: " + (err.message || err));
        }
      }
    }

    function stopTestCamera() {
      isPoseEstimating = false;
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }
      const video = $("testCameraVideo");
      if (video) {
        video.srcObject = null;
        video.style.display = "none";
      }
      const canvas = $("testCameraCanvas");
      if (canvas) {
        canvas.style.display = "none";
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
      const img = $("testCameraImg");
      if (img) {
        img.removeAttribute("src");
        img.style.display = "none";
      }
      
      if (isBackendOnline && authToken) {
        fetch(`${apiBaseUrl()}/api/control/stop`, {
          method: "POST",
          headers: { Authorization: `Bearer ${authToken}` },
        }).catch(() => {});
      }
    }

    function toggleStreamMode() {
      stopTestCamera();
    }

    function startPoseEstimator(video, canvas) {
      const ctx = canvas.getContext("2d");
      const pose = new Pose({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
      });

      pose.setOptions({
        modelComplexity: 1,
        smoothLandmarks: true,
        enableSegmentation: false,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });

      pose.onResults((results) => {
        if (!isPoseEstimating) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (results.poseLandmarks) {
          drawConnectors(ctx, results.poseLandmarks, POSE_CONNECTIONS, { color: '#00FF00', lineWidth: 2 });
          drawLandmarks(ctx, results.poseLandmarks, { color: '#FF0000', lineWidth: 1, radius: 3 });
        }
      });

      async function detectionFrame() {
        if (!isPoseEstimating) return;
        if (video.readyState >= 2) {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          await pose.send({ image: video });
        }
        requestAnimationFrame(detectionFrame);
      }
      
      video.addEventListener('loadeddata', () => {
        detectionFrame();
      });
    }

    async function syncFromBackend() {
      if (!isBackendOnline || !authToken) return;
      try {
        const [cRes, aRes] = await Promise.all([
          fetch(`${apiBaseUrl()}/api/cameras`, { headers: { Authorization: `Bearer ${authToken}` } }),
          fetch(`${apiBaseUrl()}/api/alerts`, { headers: { Authorization: `Bearer ${authToken}` } })
        ]);
        
        let changed = false;
        if (cRes.ok) {
          const c = await cRes.json();
          if (c && Array.isArray(c)) {
            if (JSON.stringify(c) !== JSON.stringify(cameras)) {
              cameras = c;
              saveStore("fg_cameras", cameras);
              changed = true;
            }
          }
        }
        if (aRes.ok) {
          const a = await aRes.json();
          if (a && a.alerts && Array.isArray(a.alerts)) {
            if (JSON.stringify(a.alerts) !== JSON.stringify(alerts)) {
              alerts = a.alerts;
              saveStore("fg_alerts", alerts);
              changed = true;
            }
          }
        }
        
        await syncAppStateFromBackend();
        
        if (changed) {
          render(currentView, false);
        }
      } catch (e) {
        console.error("Lỗi đồng bộ:", e);
      }
    }

    async function initClientApp() {
      await checkBackendStatus();
      
      // Load current client profile
      const savedEmail = localStorage.getItem("nckh_current_user_email") || "bao@nckh.vn";
      
      if (isBackendOnline && authToken) {
        await syncAppStateFromBackend();
        
        try {
          const res = await fetch(`${apiBaseUrl()}/api/users`, { headers: { Authorization: `Bearer ${authToken}` } });
          if (res.ok) {
            const allUsers = await res.json();
            const me = allUsers.find(x => x.email.toLowerCase() === savedEmail.toLowerCase());
            if (me) {
              currentUser = me;
              $("headerUserName").textContent = me.name;
            }
          }
          
          // Sync camera list
          const camRes = await fetch(`${apiBaseUrl()}/api/cameras`, { headers: { Authorization: `Bearer ${authToken}` } });
          if (camRes.ok) {
            cameras = await camRes.json();
          }

          // Sync alerts
          const alertRes = await fetch(`${apiBaseUrl()}/api/alerts`, { headers: { Authorization: `Bearer ${authToken}` } });
          if (alertRes.ok) {
            const data = await alertRes.json();
            if (data && data.alerts && Array.isArray(data.alerts)) {
              alerts = data.alerts;
            }
          }
        } catch (e) {}
      }
      
      updateDrawerFooter();
      render("dashboard", false);
    }

    window.onload = initClientApp;
  </script>
