      { id: "NT-003", type: "maintenance", title: "Hội hệ thống bảo trì", content: "Hệ thống FallGuard AI sẽ tiến hành bảo trì nâng cấp thuật toán từ 01:00 đến 03:00 ngày 20/06/2026.", time: "14/06/2026 18:00", read: true }
    ]);

    let currentUser = { email: "bao@nckh.vn", name: "Cao Đình Bảo", role: "Khachhang", phone: "0987.654.321", assignedCameras: ["CAM-001", "CAM-002", "CAM-003", "CAM-004", "CAM-005", "CAM-006"] };
    let authToken = localStorage.getItem("nckh_auth_token") || "";
    let isBackendOnline = false;
    let currentView = "dashboard";

    // Live stream control
    let liveViewLevel = "locations"; // "locations", "cameras", "stream"
    let selectedLocation = "";
    let localStream = null;
    let isPoseEstimating = false;
    let aiFallTestOn = false;

    // MediaPipe & Client-side Pose FallDetector state
    const DETECTOR_CONFIG = {
      torso_fall_angle_deg: 62,
      torso_upright_angle_deg: 35,
      head_hip_height_ratio: 0.18,
      hip_drop_velocity: 0.035,
      angle_change_velocity_deg: 18,
      min_fall_frames: 7,
      warning_frames: 3,
      alert_after_seconds: 10,
      alert_on_long_lying_without_fall: false,
      assumed_fps: 30,
      cooldown_frames: 20
    };
    let prevHipY = null;
    let prevTorsoAngle = null;
    let abnormalFrames = 0;
    let lyingFrames = 0;
    let recentUprightFrames = 0;
    let fallCandidate = false;
    let alertActive = false;
    let cooldown = 0;

    let audioCtx = null;
    let alarmInterval = null;

    function resetDetector() {
      prevHipY = null;
      prevTorsoAngle = null;
      abnormalFrames = 0;
      lyingFrames = 0;
      recentUprightFrames = 0;
      fallCandidate = false;
      alertActive = false;
      cooldown = 0;
    }

    function angleFromVertical(shoulder, hip) {
      const dx = shoulder.x - hip.x;
      const dy = shoulder.y - hip.y;
      return Math.abs(Math.atan2(Math.abs(dx), Math.abs(dy)) * (180 / Math.PI));
    }

    function playAlarmSound() {
      if (!window.AudioContext && !window.webkitAudioContext) return;
      stopAlarmSound();
      
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      
      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }
      
      let beepCount = 0;
      alarmInterval = setInterval(() => {
        if (beepCount >= 10) { // beep 10 times then stop
          stopAlarmSound();
          return;
        }
        
        try {
          const osc = audioCtx.createOscillator();
          const gainNode = audioCtx.createGain();
          
          osc.connect(gainNode);
          gainNode.connect(audioCtx.destination);
          
          osc.type = "sine";
          // Siren sound sweep from 600Hz to 1200Hz
          osc.frequency.setValueAtTime(600, audioCtx.currentTime);
          osc.frequency.linearRampToValueAtTime(1200, audioCtx.currentTime + 0.3);
          
          gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
          gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
          
          osc.start();
          osc.stop(audioCtx.currentTime + 0.5);
        } catch (e) {
          console.error("Lỗi phát âm thanh alarm:", e);
        }
        
        beepCount++;
      }, 600);
    }

    function stopAlarmSound() {
      if (alarmInterval) {
        clearInterval(alarmInterval);
        alarmInterval = null;
      }
    }

    // JS Implementation of FallDetector rules
    function updateDetector(landmarks) {
      const nose = landmarks[0];
      const lShoulder = landmarks[11];
      const rShoulder = landmarks[12];
      const lHip = landmarks[23];
      const rHip = landmarks[24];
      
      if (!nose || !lShoulder || !rShoulder || !lHip || !rHip) {
        return null;
      }
      
      // Midpoints
      const shoulder = {
        x: (lShoulder.x + rShoulder.x) / 2.0,
        y: (lShoulder.y + rShoulder.y) / 2.0
      };
      const hip = {
        x: (lHip.x + rHip.x) / 2.0,
        y: (lHip.y + rHip.y) / 2.0
      };
      
      const torsoAngle = angleFromVertical(shoulder, hip);
      const headHipDelta = hip.y - nose.y;
      
      const hipVelocity = prevHipY === null ? 0.0 : hip.y - prevHipY;
      const angleVelocity = prevTorsoAngle === null ? 0.0 : torsoAngle - prevTorsoAngle;
      
      prevHipY = hip.y;
      prevTorsoAngle = torsoAngle;
      
      const torsoIsHorizontal = torsoAngle >= DETECTOR_CONFIG.torso_fall_angle_deg;
      const torsoIsUpright = torsoAngle <= DETECTOR_CONFIG.torso_upright_angle_deg;
      const headIsLow = headHipDelta <= DETECTOR_CONFIG.head_hip_height_ratio;
      const hipDroppedFast = hipVelocity >= DETECTOR_CONFIG.hip_drop_velocity;
      const bodyRotatedFast = angleVelocity >= DETECTOR_CONFIG.angle_change_velocity_deg;
      const lying = torsoIsHorizontal && headIsLow;
      
      if (torsoIsUpright) {
        recentUprightFrames = Math.min(recentUprightFrames + 1, 30);
      } else {
        recentUprightFrames = Math.max(0, recentUprightFrames - 1);
      }
      
      const fallLikeTransition = torsoIsHorizontal && (
        hipDroppedFast || bodyRotatedFast || recentUprightFrames >= 2
      );
      
      if (fallLikeTransition) {
        fallCandidate = true;
      }
      
      if (lying) {
        lyingFrames++;
      } else {
        lyingFrames = 0;
        fallCandidate = false;
        alertActive = false;
      }
      
      const abnormal = lying && (
        fallCandidate || DETECTOR_CONFIG.alert_on_long_lying_without_fall
      );
      
      if (abnormal) {
        abnormalFrames++;
      } else {
        abnormalFrames = Math.max(0, abnormalFrames - 1);
      }
      
      let state = "normal";
      let eventStarted = false;
      const lyingSeconds = lyingFrames / Math.max(DETECTOR_CONFIG.assumed_fps, 1.0);
      
      if (abnormalFrames >= DETECTOR_CONFIG.min_fall_frames && lyingSeconds >= DETECTOR_CONFIG.alert_after_seconds) {
        state = "alert";
        if (!alertActive && cooldown === 0) {
          eventStarted = true;
          alertActive = true;
          cooldown = DETECTOR_CONFIG.cooldown_frames;
        }
      } else if (abnormalFrames >= DETECTOR_CONFIG.min_fall_frames) {
        state = "fallen";
      } else if (abnormalFrames >= DETECTOR_CONFIG.warning_frames) {
        state = "possible_fall";
      } else if (lying) {
        state = "lying";
      } else if (abnormalFrames >= DETECTOR_CONFIG.warning_frames) {
        state = "warning";
      } else {
        state = "normal";
      }
      
      if (cooldown > 0) {
        cooldown--;
      }
      
      return {
        state,
        torsoAngle,
        headHipDelta,
        hipVelocity,
        angleVelocity,
        abnormalFrames,
        lyingSeconds,
        fallLikeTransition,
        eventStarted
      };
    }


    // Helpers
    function $(id) { return document.getElementById(id); }
    function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
    function card(title, body) { return `<div class="card" style="padding:16px; margin-bottom:14px;"><h3 style="margin:0 0 12px; font-size:14px; font-weight:700; color:var(--muted);">${title}</h3>${body}</div>`; }
    function statusPill(status) {
      const cls = status === "online" || status === "Đang hoạt động" || status === "Hoạt động" || status === "ĐANG CHẠY" || status === "NORMAL" || status === "WALKING" || status === "SITTING" || status === "LYING" ? "green" : status === "Bảo trì" || status === "maintenance" || status === "Đang xử lý" || status === "Warning" ? "amber" : "red";
      return `<span class="pill ${cls}">${esc(status)}</span>`;
    }
    function apiBaseUrl() { return window.location.port === "5500" ? "http://127.0.0.1:8000" : window.location.origin; }

    function getInitials(name) {
      if (!name) return "US";
      const words = name.trim().split(/\s+/);
      if (words.length === 1) return words[0].substring(0, 2).toUpperCase();
      const first = words[0].charAt(0);
      const last = words[words.length - 1].charAt(0);
      return (first + last).toUpperCase();
    }

    function formatRole(role) {
      if (!role) return "User (Khách hàng)";
      if (role.toLowerCase() === "admin") return "Quản trị viên";
      if (role.toLowerCase() === "khachhang" || role.toLowerCase() === "user" || role.toLowerCase() === "khách hàng") return "User (Khách hàng)";
      return role;
    }

    function updateDrawerFooter() {
      const footerEl = $("menuDrawerFooter");
      if (!footerEl) return;
      const name = currentUser.name || "Khách hàng";
      const initials = getInitials(name);
      const displayRole = formatRole(currentUser.role);
      
      footerEl.innerHTML = `
        <div class="menu-drawer-user-info">
          <div class="menu-drawer-avatar">${esc(initials)}</div>
          <div class="menu-drawer-user-detail">
            <span class="menu-drawer-user-name">${esc(name)}</span>
            <span class="menu-drawer-user-role">${esc(displayRole)}</span>
          </div>
        </div>
        <button class="menu-drawer-logout-btn" onclick="performLogout()">Đăng xuất</button>
      `;
    }

    function performLogout() {
      if (isBackendOnline && authToken) {
        fetch(`${apiBaseUrl()}/api/auth/logout`, { method: "POST", headers: { Authorization: `Bearer ${authToken}` } }).catch(() => {});
      }
      localStorage.removeItem("nckh_auth_token");
      localStorage.removeItem("nckh_current_user_email");
      localStorage.removeItem("fg_monitored_profile");
      localStorage.removeItem("fg_emergency_contacts");
      localStorage.removeItem("fg_user_notifications");
      window.location.replace("index.html");
    }

    async function checkBackendStatus() {
      try {
        const res = await fetch(`${apiBaseUrl()}/api/health`);
        if (res.ok) {
          isBackendOnline = true;
          const p = $("backendStatusPill");
          if (p) { p.textContent = "AI Online"; p.className = "pill green small"; }
          return true;
        }
      } catch (e) {}
      isBackendOnline = false;
      const p = $("backendStatusPill");
      if (p) { p.textContent = "Simulator"; p.className = "pill grey small"; }
      return false;
    }

    function saveAll() {
      saveStore("fg_monitored_profile", monitoredProfile);
      saveStore("fg_emergency_contacts", emergencyContacts);
      saveStore("fg_user_notifications", userNotifications);
      if (typeof syncAppStateToBackend === 'function') {
        syncAppStateToBackend();
      }
    }

    async function syncAppStateFromBackend() {
      if (!isBackendOnline || !authToken) return;
      try {
        const res = await fetch(`${apiBaseUrl()}/api/appstate`, {
          headers: { Authorization: `Bearer ${authToken}` }
        });
        if (res.ok) {
          const data = await res.json();
          let changed = false;
          
          if (typeof monitoredProfile !== 'undefined' && data.monitored_profile_json) {
            const remote = JSON.parse(data.monitored_profile_json);
            if (JSON.stringify(remote) !== JSON.stringify(monitoredProfile)) {
              monitoredProfile = remote;
              saveStore("fg_monitored_profile", monitoredProfile);
              changed = true;
            }
          }
          if (typeof emergencyContacts !== 'undefined' && data.emergency_contacts_json) {
            const remote = JSON.parse(data.emergency_contacts_json);
            if (JSON.stringify(remote) !== JSON.stringify(emergencyContacts)) {
              emergencyContacts = remote;
              saveStore("fg_emergency_contacts", emergencyContacts);
              changed = true;
            }
          }
          if (typeof userNotifications !== 'undefined' && data.user_notifications_json) {
            const remote = JSON.parse(data.user_notifications_json);
            if (JSON.stringify(remote) !== JSON.stringify(userNotifications)) {
              userNotifications = remote;
              saveStore("fg_user_notifications", userNotifications);
              changed = true;
            }
          }
          
          if (changed && typeof render === 'function') {
            render(currentView, false);
          }
        }
      } catch (e) {
        console.error("Lỗi đồng bộ appstate từ backend:", e);
      }
    }

    async function syncAppStateToBackend() {
      if (!isBackendOnline || !authToken) return;
      try {
        const payload = {};
        if (typeof monitoredProfile !== 'undefined') payload.monitored_profile_json = JSON.stringify(monitoredProfile);
        if (typeof emergencyContacts !== 'undefined') payload.emergency_contacts_json = JSON.stringify(emergencyContacts);
        if (typeof userNotifications !== 'undefined') payload.user_notifications_json = JSON.stringify(userNotifications);
        
        await fetch(`${apiBaseUrl()}/api/appstate`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${authToken}`
          },
          body: JSON.stringify(payload)
        });
      } catch (e) {
        console.error("Lỗi đồng bộ appstate lên backend:", e);
      }
    }

    function selectCameraMobile(cameraId) {
      const cam = cameras.find(c => c.id === cameraId);
      if (cam) {
        if (cam.status === "offline") {
          alert(`Camera "${cam.name}" đang không hoạt động.`);
          return;
        }
        if (cam.status === "maintenance" || cam.status === "Bảo trì") {
          alert(`Camera "${cam.name}" đang trong thời gian bảo trì.`);
          return;
        }
      }
      selectedCameraId = cameraId;
      liveViewLevel = "stream";
      switchTab("live");
      // Auto-start camera khi click vào camera card
      setTimeout(() => startTestCamera(), 150);
    }

    function aiStreamUrl() {
      return `${apiBaseUrl()}/api/camera/stream.mjpg?token=${encodeURIComponent(authToken)}&ts=${Date.now()}`;
    }

    async function backendLogin(force = false) {
      if (authToken && !force) {
        try {
          const check = await fetch(`${apiBaseUrl()}/api/detection/status`, {
            headers: { Authorization: `Bearer ${authToken}` }
          });
          if (check.status === 401) {
            force = true;
          } else {
            return authToken;
          }
        } catch (e) {
          return authToken;
        }
      }
      
      const savedEmail = localStorage.getItem("nckh_current_user_email") || "bao@nckh.vn";
      const username = savedEmail;
      const password = "nckh2025";
      
      const res = await fetch(`${apiBaseUrl()}/api/auth/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password }),
      });
      const payload = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(payload.detail || "Không đăng nhập được backend AI.");

    // Tab view logic
    function switchTab(viewName) {
      if (viewName !== "live") {
        stopTestCamera();
      }
      currentView = viewName;
      document.querySelectorAll(".mobile-nav-item").forEach(item => {
        const targetView = item.dataset.view;
        if (viewName === 'live') {
          item.classList.toggle("active", targetView === 'dashboard');
        } else {
          item.classList.toggle("active", targetView === viewName);
        }
      });

      // Sync drawer item highlight
      let activeDrawerId = `drawer-${viewName}`;
      document.querySelectorAll(".menu-drawer-item").forEach(item => {
        item.classList.toggle("active", item.id === activeDrawerId);
      });

      render(viewName);
    }

    function openMenuDrawer() {
      $("menuDrawer").classList.add("open");
      $("menuDrawerBackdrop").classList.add("open");
    }

    function closeMenuDrawer() {
      $("menuDrawer").classList.remove("open");
      $("menuDrawerBackdrop").classList.remove("open");
    }

    function selectMenuView(viewName) {
      closeMenuDrawer();
      if (viewName === "dashboard") {
        switchTab("dashboard");
      } else if (viewName === "live") {
        liveViewLevel = "locations";
        switchTab("live");
      } else if (viewName === "alerts") {
        switchTab("alerts");
      } else if (viewName === "profile" || viewName === "contacts") {
        switchTab("profile");
        if (viewName === "contacts") {
          setTimeout(() => {
            const cards = document.querySelectorAll(".card");
            if (cards.length >= 2) cards[1].scrollIntoView({ behavior: "smooth" });
          }, 100);
        }
      } else if (viewName === "notifications") {
        switchTab("notifications");
      }
    }

      if (userNotifications[idx]) {
        userNotifications[idx].read = !userNotifications[idx].read;
        saveAll();
        render(currentView);
      }
    }

    function deleteNotification(idx) {
      if (confirm("Xóa thông báo này?")) {
        userNotifications.splice(idx, 1);
        saveAll();
        render(currentView);

    function startPoseEstimator(video, canvas) {
      const ctx = canvas.getContext("2d");
      const pose = new Pose({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
      });

      pose.setOptions({
        modelComplexity: 1,
        smoothLandmarks: true,
        enableSegmentation: false,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });

      pose.onResults((results) => {
        if (!isPoseEstimating) return;
        
        if (canvas.width !== results.image.width || canvas.height !== results.image.height) {
          canvas.width = results.image.width;
          canvas.height = results.image.height;
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        if (results.poseLandmarks) {
          drawConnectors(ctx, results.poseLandmarks, POSE_CONNECTIONS, { color: '#00FF00', lineWidth: 4 });
          drawLandmarks(ctx, results.poseLandmarks, { color: '#FF0000', lineWidth: 2, radius: 4 });

          // Run detection rules
          const detection = updateDetector(results.poseLandmarks);
          let localState = "normal";
          if (detection) {
            localState = detection.state;
            if (detection.eventStarted) {
              triggerLocalFallAlert(detection);
            }
          }

          // Bounding Box
          let minX = 1.0, maxX = 0.0, minY = 1.0, maxY = 0.0;
          results.poseLandmarks.forEach(kp => {
            if (kp.x < minX) minX = kp.x;
            if (kp.x > maxX) maxX = kp.x;
            if (kp.y < minY) minY = kp.y;
            if (kp.y > maxY) maxY = kp.y;
          });
          
          const padX = (maxX - minX) * 0.15;
          const padY = (maxY - minY) * 0.15;
          minX = Math.max(0, minX - padX);
          maxX = Math.min(1, maxX + padX);
          minY = Math.max(0, minY - padY);
          maxY = Math.min(1, maxY + padY);

          const isFallen = localState === "alert" || localState === "fallen" || aiFallTestOn;
          ctx.strokeStyle = isFallen ? "#f43f5e" : "#10b981";
          ctx.lineWidth = 3;
          ctx.strokeRect(
            minX * canvas.width, 
            minY * canvas.height, 
            (maxX - minX) * canvas.width, 
            (maxY - minY) * canvas.height
          );
          
          // Draw label: Đứng / Nằm / Ngồi / Đi / Té ngã
          let labelText = "ĐỨNG";
          if (isFallen) {
            labelText = "TÉ NGÃ";
          } else if (localState === "lying" || localState === "possible_fall") {
            labelText = "NẰM";
          } else if (localState === "sitting") {
            labelText = "NGỒI";
          } else if (localState === "walking") {
            labelText = "ĐI";
          }
          
          ctx.fillStyle = isFallen ? "#f43f5e" : "#10b981";
          ctx.font = "bold 16px Arial";
          ctx.fillText(labelText, minX * canvas.width, Math.max(20, minY * canvas.height - 8));

          // Update Mobile stream page status badge
          const stateBadge = $("liveStateBadge");
          if (stateBadge) {
            stateBadge.textContent = isFallen ? "FALL DETECTED" : localState.toUpperCase();
            stateBadge.className = `state pill ${isFallen ? 'red' : 'green'}`;
          }
        }
      });

      async function detectionFrame() {
        if (!isPoseEstimating) return;
        if (video.readyState >= 2) {
          await pose.send({ image: video });
        }
        requestAnimationFrame(detectionFrame);
      }
      
      video.addEventListener('loadeddata', () => {
        detectionFrame();
      });
    }

        let changed = false;
        if (cRes.ok) {
          const c = await cRes.json();
          if (c && Array.isArray(c)) {
            if (JSON.stringify(c) !== JSON.stringify(cameras)) {
              cameras = c;
              saveStore("fg_cameras", cameras);
              changed = true;
            }
          }
        }
        if (aRes.ok) {
          const a = await aRes.json();
          if (a && a.alerts && Array.isArray(a.alerts)) {
            if (JSON.stringify(a.alerts) !== JSON.stringify(alerts)) {
              alerts = a.alerts;
              saveStore("fg_alerts", alerts);
              changed = true;
            }
          }
        }
        
        await syncAppStateFromBackend();
        
        if (changed) {
          render(currentView, false);
        }
      } catch (e) {
        console.error("Lỗi đồng bộ:", e);
      }
    }

    async function initClientApp() {
      await checkBackendStatus();
      
      // Load current client profile
      const savedEmail = localStorage.getItem("nckh_current_user_email") || "bao@nckh.vn";
      
      if (isBackendOnline && authToken) {
        await syncAppStateFromBackend();
        
        try {
          const res = await fetch(`${apiBaseUrl()}/api/users`, { headers: { Authorization: `Bearer ${authToken}` } });
          if (res.ok) {
            const allUsers = await res.json();
            const me = allUsers.find(x => x.email.toLowerCase() === savedEmail.toLowerCase());
            if (me) {
              currentUser = me;
              $("headerUserName").textContent = me.name;
            }
          }
          
          // Sync camera list
          const camRes = await fetch(`${apiBaseUrl()}/api/cameras`, { headers: { Authorization: `Bearer ${authToken}` } });
          if (camRes.ok) {
            cameras = await camRes.json();
          }

          // Sync alerts
          const alertRes = await fetch(`${apiBaseUrl()}/api/alerts`, { headers: { Authorization: `Bearer ${authToken}` } });
          if (alertRes.ok) {
            const data = await alertRes.json();
            if (data && data.alerts && Array.isArray(data.alerts)) {
              alerts = data.alerts;
            }
          }
        } catch (e) {}
      }
      
      updateDrawerFooter();
      render("dashboard", false);
    }

    window.onload = initClientApp;
  </script>
</body>
</html>
