    /* Keyframes and Animations */
    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.5; box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
      70% { transform: scale(1); opacity: 1; box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
      100% { transform: scale(0.95); opacity: 0.5; box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }
    @keyframes pulse-red {
      0% { transform: scale(0.95); opacity: 0.5; box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
      70% { transform: scale(1); opacity: 1; box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); }
      100% { transform: scale(0.95); opacity: 0.5; box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    @keyframes pulse-warning {
      0% { transform: scale(0.95); opacity: 0.5; box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.4); }
      70% { transform: scale(1); opacity: 1; box-shadow: 0 0 0 6px rgba(245, 158, 11, 0); }
      100% { transform: scale(0.95); opacity: 0.5; box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
    }
    
    .status-dot-pulse {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 6px;
    }
    .status-dot-pulse.online {
      background-color: #10b981;
      animation: pulse 2s infinite;
    }
    .status-dot-pulse.offline {
      background-color: #ef4444;
      animation: pulse-red 2s infinite;
    }
    .status-dot-pulse.maintenance {
      background-color: #f59e0b;
      animation: pulse-warning 2s infinite;
    }

    /* Pulse ring animation */
    .pulse-ring {
      position: absolute;
      top: -4px;
      left: -4px;
      right: -4px;
      bottom: -4px;
      border: 2px solid rgba(239, 68, 68, 0.5);
      border-radius: 50%;
      animation: pulse-wave 1.5s infinite ease-out;
      pointer-events: none;
      z-index: 1;
    }
    @keyframes pulse-wave {
      0% {

        opacity: 1;
      }
      100% {
        transform: scale(1.6);
        opacity: 0;
      }

    // Audio Context Alarm Sound Synthesis
    let audioCtx = null;
    let alarmInterval = null;

    function playAlarmSound() {
      if (!window.AudioContext && !window.webkitAudioContext) return;
      stopAlarmSound();
      
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      
      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }
      
      let beepCount = 0;
      alarmInterval = setInterval(() => {
        if (beepCount >= 10) { // beep 10 times (about 10 seconds) then stop
          stopAlarmSound();
          return;
        }
        
        try {
          const osc = audioCtx.createOscillator();
          const gainNode = audioCtx.createGain();
          
          osc.connect(gainNode);
          gainNode.connect(audioCtx.destination);
          
          osc.type = "sine";
          // Siren sound sweep from 600Hz to 1200Hz
          osc.frequency.setValueAtTime(600, audioCtx.currentTime);
          osc.frequency.linearRampToValueAtTime(1200, audioCtx.currentTime + 0.3);
          
          gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
          gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
          
          osc.start();
          osc.stop(audioCtx.currentTime + 0.5);
        } catch (e) {
          console.error("Lỗi phát âm thanh alarm:", e);
        }
        
        beepCount++;
      }, 600);
    }

    function stopAlarmSound() {
      if (alarmInterval) {
        clearInterval(alarmInterval);
        alarmInterval = null;
      }
    }

    async function syncAppStateFromBackend() {

      try {

          headers: { Authorization: `Bearer ${authToken}` }
        });
        if (res.ok) {
          const data = await res.json();
          let changed = false;
          
          if (typeof apiKeys !== 'undefined' && data.api_keys_json) {
            const remote = JSON.parse(data.api_keys_json);
            if (JSON.stringify(remote) !== JSON.stringify(apiKeys)) {
              apiKeys = remote;
              saveStore("fg_api_keys", apiKeys);
              changed = true;
            }
          }
          if (typeof settings !== 'undefined' && data.settings_json) {
            const remote = JSON.parse(data.settings_json);
            if (JSON.stringify(remote) !== JSON.stringify(settings)) {
              settings = remote;
              saveStore("fg_settings", settings);
              changed = true;
            }
          }
          if (typeof monitoredProfile !== 'undefined' && data.monitored_profile_json) {
            const remote = JSON.parse(data.monitored_profile_json);
            if (JSON.stringify(remote) !== JSON.stringify(monitoredProfile)) {
              monitoredProfile = remote;
              saveStore("fg_monitored_profile", monitoredProfile);
              changed = true;
            }
          }
          if (typeof emergencyContacts !== 'undefined' && data.emergency_contacts_json) {
            const remote = JSON.parse(data.emergency_contacts_json);
            if (JSON.stringify(remote) !== JSON.stringify(emergencyContacts)) {
              emergencyContacts = remote;
              saveStore("fg_emergency_contacts", emergencyContacts);
              changed = true;
            }
          }
          if (typeof userNotifications !== 'undefined' && data.user_notifications_json) {
            const remote = JSON.parse(data.user_notifications_json);
            if (JSON.stringify(remote) !== JSON.stringify(userNotifications)) {
              userNotifications = remote;
              saveStore("fg_user_notifications", userNotifications);
              changed = true;
            }
          }
          
          if (changed && typeof render === 'function') {
            render(currentView, false);
          }
        }
      } catch (e) {
        console.error("Lỗi đồng bộ appstate từ backend:", e);

        return div;
      })();
      
      const toastEl = document.createElement("div");
      toastEl.style.background = "#1e293b";
      toastEl.style.color = "#fff";
      toastEl.style.padding = "12px 18px";
      toastEl.style.borderRadius = "8px";

      toastEl.style.transform = "translateY(20px)";
      toastEl.style.borderLeft = "4px solid var(--blue)";
      toastEl.textContent = message;
      
      container.appendChild(toastEl);
      
      setTimeout(() => {
        toastEl.style.opacity = "1";

        }, 300);
      }, 3000);

    function captureScreenshot() {
      const video = document.getElementById("testCameraVideo");
      const canvas = document.getElementById("testCameraCanvas");
      const img = document.getElementById("testCameraImg");
      const modeSelect = document.getElementById("cameraModeSelect");
      const isClientMode = modeSelect ? modeSelect.value === "client" : true;
      
      const targetCanvas = document.createElement("canvas");
      const ctx = targetCanvas.getContext("2d");
      
      if (isClientMode && video && video.readyState === video.HAVE_ENOUGH_DATA) {
        targetCanvas.width = video.videoWidth;
        targetCanvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0);
        if (canvas && canvas.style.display !== "none") {
          ctx.drawImage(canvas, 0, 0, targetCanvas.width, targetCanvas.height);
        }
      } else if (!isClientMode && img && img.src && img.style.display !== "none") {
        targetCanvas.width = img.naturalWidth || 640;
        targetCanvas.height = img.naturalHeight || 480;
        ctx.drawImage(img, 0, 0);
      } else {
        alert("Camera chưa được mở hoặc không có luồng dữ liệu.");
        return;
      }
      
      const link = document.createElement("a");
      link.download = `screenshot_${selectedCameraId || 'camera'}_${Date.now()}.jpg`;
      link.href = targetCanvas.toDataURL("image/jpeg", 0.9);
      link.click();
      toast("Đã chụp và tải ảnh màn hình thành công!");
    }

    function toolBar(search, filters) {

      return `<div class="settings">${rows.map(([k,v])=>`<div class="setting-row"><div><strong>${k}</strong><p class="hint">Có thể chỉnh trong cấu hình hệ thống.</p></div><strong>${v}</strong></div>`).join("")}<button class="btn primary">Lưu cài đặt</button></div>`;
    }
    function mediaActions() { return `<button class="btn small line">Xem</button> <button class="btn small line">Tải về</button> <button class="btn small danger">Xóa</button>`; }
    function apiActions() { return `<button class="btn small primary">Tạo key</button> <button class="btn small danger">Thu hồi</button>`; }
    function cameraForm() {
      return `<h3>Thêm / cập nhật camera</h3><div class="form-grid">${["Tên camera","IP Camera","RTSP URL","Vị trí","Mô tả","FPS","Độ phân giải","Ngưỡng phát hiện"].map(x=>`<label class="field"><span>${x}</span><input class="control" placeholder="${x}"></label>`).join("")}</div><button class="btn primary">Lưu camera</button>`;
    }
    
    function userForm() {
      return `<h3>Thêm tài khoản</h3><div class="form-grid">${["Tài khoản","Mật khẩu","Họ tên","Vai trò"].map(x=>`<label class="field"><span>${x}</span><input class="control" placeholder="${x}"></label>`).join("")}</div><button class="btn primary">Lưu tài khoản</button>`;
    }


    function cameraById(id) {
      const vis = getVisibleCameras();
      if (vis.length === 0) return null;
      return vis.find((cam) => cam.id === id) || vis[0];
    }

    function cameraMetrics(cam) {
      const fallen = cam.state === "fallen";
      const warn = ["walking", "sitting", "lying"].includes(cam.state);
      return {
        status: fallen ? "Fallen" : warn ? "Warning" : "Normal",
        confidence: fallen ? "94%" : warn ? "81%" : "18%",
        lying: fallen ? "02:41" : cam.state === "lying" ? "00:14" : "00:00",
        torso: fallen ? "87°" : warn ? "54°" : "12°",
        hip: fallen ? "1.82 m/s" : warn ? "0.72 m/s" : "0.10 m/s",
      };
    }

      }

          `;
        }).join("");

        return `

            <button class="btn line" data-back-dashboard>← Quay lại Dashboard</button>

          </div>
          <div class="grid three" style="gap: 20px;">
            ${locationCardsHtml || '<div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--muted);">Không tìm thấy nơi lắp đặt nào.</div>'}
          </div>
        `;
      }

      // LEVEL 2: Cameras list in selected location
      if (liveViewLevel === "cameras") {
        const houses = getVisibleHouses();
        const house = houses.find(h => h.name === selectedLocation);
        const camsInHouse = house ? house.cameras.map(id => cameraById(id)).filter(Boolean) : [];

    async function fetchBackendLogs() {
      const btnRefresh = $("btnRefreshLogs");
      if (btnRefresh) btnRefresh.disabled = true;
      
      if (!isBackendOnline || !authToken) {
        updateLogsContainer(1);
        if (btnRefresh) btnRefresh.disabled = false;
        return;
      }
      try {
        const res = await fetch(`${apiBaseUrl()}/api/logs`, {
          headers: { Authorization: `Bearer ${authToken}` }
        });
        if (res.ok) {
          const data = await res.json();
          if (data.logs) {
            systemLogs = data.logs;
            updateLogsContainer(1);
          }
        }
      } catch (e) {
        console.error("Lỗi tải logs:", e);
        updateLogsContainer(1);
      } finally {
        if (btnRefresh) btnRefresh.disabled = false;
      }
    }

    function updateLogsContainer(page = 1) {
      logsCurrentPage = page;
      const container = $("logsTableContainer");
      const paginationContainer = $("logsPaginationContainer");
      if (!container) return;
      
      const dataSrc = (systemLogs && systemLogs.length > 0) ? systemLogs : logs;
      const totalLogs = dataSrc.length;
      const totalPages = Math.max(1, Math.ceil(totalLogs / logsPerPage));
      
      if (logsCurrentPage < 1) logsCurrentPage = 1;
      if (logsCurrentPage > totalPages) logsCurrentPage = totalPages;
      
      const startIndex = (logsCurrentPage - 1) * logsPerPage;
      const endIndex = Math.min(startIndex + logsPerPage, totalLogs);
      const pageLogs = dataSrc.slice(startIndex, endIndex);
      
      container.innerHTML = table(["Thời gian", "Loại hành động", "Người thực hiện", "Nội dung chi tiết"], pageLogs.map(l => [
        esc(l[0]), statusPill(l[1]), esc(l[2]), esc(l[3])
      ]));
      
      if (paginationContainer) {
        let pagesHtml = "";
        const prevDisabled = logsCurrentPage === 1 ? "disabled" : "";
        pagesHtml += `<button class="pagination-btn" ${prevDisabled} onclick="updateLogsContainer(${logsCurrentPage - 1})">Trước</button>`;
        
        for (let i = 1; i <= totalPages; i++) {
          const activeClass = i === logsCurrentPage ? "active" : "";
          pagesHtml += `<button class="pagination-btn ${activeClass}" onclick="updateLogsContainer(${i})">${i}</button>`;
        }
        
        const nextDisabled = logsCurrentPage === totalPages ? "disabled" : "";
        pagesHtml += `<button class="pagination-btn" ${nextDisabled} onclick="updateLogsContainer(${logsCurrentPage + 1})">Sau</button>`;
        
        paginationContainer.innerHTML = `
          <div class="pagination-bar">
            <span style="font-size: 13px; color: var(--gray-600);">
              Hiển thị từ <strong>${totalLogs > 0 ? startIndex + 1 : 0}</strong> đến <strong>${endIndex}</strong> trong tổng số <strong>${totalLogs}</strong> nhật ký
            </span>
            <div class="pagination-controls">
              ${pagesHtml}
            </div>
          </div>
        `;
      }
    }

    // Reset Detector State
    function resetDetector() {
      prevHipY = null;
      prevTorsoAngle = null;
      abnormalFrames = 0;
      lyingFrames = 0;
      recentUprightFrames = 0;
      fallCandidate = false;
      alertActive = false;
      cooldown = 0;
    }

    // Angle from Vertical helper
    function angleFromVertical(shoulder, hip) {
      const dx = shoulder.x - hip.x;
      const dy = shoulder.y - hip.y;
      return Math.abs(Math.atan2(Math.abs(dx), Math.abs(dy)) * (180 / Math.PI));
    }

    // JS Implementation of FallDetector rules
    function updateDetector(landmarks) {
      const nose = landmarks[0];
      const lShoulder = landmarks[11];
      const rShoulder = landmarks[12];
      const lHip = landmarks[23];
      const rHip = landmarks[24];
      
      if (!nose || !lShoulder || !rShoulder || !lHip || !rHip) {
        return null;
      }
      
      // Midpoints
      const shoulder = {
        x: (lShoulder.x + rShoulder.x) / 2.0,
        y: (lShoulder.y + rShoulder.y) / 2.0
      };
      const hip = {
        x: (lHip.x + rHip.x) / 2.0,
        y: (lHip.y + rHip.y) / 2.0
      };
      
      const torsoAngle = angleFromVertical(shoulder, hip);
      const headHipDelta = hip.y - nose.y;
      
      const hipVelocity = prevHipY === null ? 0.0 : hip.y - prevHipY;
      const angleVelocity = prevTorsoAngle === null ? 0.0 : torsoAngle - prevTorsoAngle;
      
      prevHipY = hip.y;
      prevTorsoAngle = torsoAngle;
      
      const torsoIsHorizontal = torsoAngle >= DETECTOR_CONFIG.torso_fall_angle_deg;
      const torsoIsUpright = torsoAngle <= DETECTOR_CONFIG.torso_upright_angle_deg;
      const headIsLow = headHipDelta <= DETECTOR_CONFIG.head_hip_height_ratio;
      const hipDroppedFast = hipVelocity >= DETECTOR_CONFIG.hip_drop_velocity;
      const bodyRotatedFast = angleVelocity >= DETECTOR_CONFIG.angle_change_velocity_deg;
      const lying = torsoIsHorizontal && headIsLow;
      
      if (torsoIsUpright) {
        recentUprightFrames = Math.min(recentUprightFrames + 1, 30);
      } else {
        recentUprightFrames = Math.max(0, recentUprightFrames - 1);
      }
      
      const fallLikeTransition = torsoIsHorizontal && (
        hipDroppedFast || bodyRotatedFast || recentUprightFrames >= 2
      );
      
      if (fallLikeTransition) {
        fallCandidate = true;
      }
      
      if (lying) {
        lyingFrames++;
      } else {
        lyingFrames = 0;
        fallCandidate = false;
        alertActive = false;
      }
      
      const abnormal = lying && (
        fallCandidate || DETECTOR_CONFIG.alert_on_long_lying_without_fall
      );
      
      if (abnormal) {
        abnormalFrames++;
      } else {
        abnormalFrames = Math.max(0, abnormalFrames - 1);
      }
      
      let state = "normal";
      let eventStarted = false;
      const lyingSeconds = lyingFrames / Math.max(DETECTOR_CONFIG.assumed_fps, 1.0);
      
      if (abnormalFrames >= DETECTOR_CONFIG.min_fall_frames && lyingSeconds >= DETECTOR_CONFIG.alert_after_seconds) {
        state = "alert";
        if (!alertActive && cooldown === 0) {
          eventStarted = true;
          alertActive = true;
          cooldown = DETECTOR_CONFIG.cooldown_frames;
        }
      } else if (abnormalFrames >= DETECTOR_CONFIG.min_fall_frames) {
        state = "fallen";
      } else if (abnormalFrames >= DETECTOR_CONFIG.warning_frames) {
        state = "possible_fall";
      } else if (lying) {
        state = "lying";
      } else if (abnormalFrames >= DETECTOR_CONFIG.warning_frames) {
        state = "warning";
      } else {
        state = "normal";
      }
      
      if (cooldown > 0) {
        cooldown--;
      }
      
      return {
        state,
        torsoAngle,
        headHipDelta,
        hipVelocity,
        angleVelocity,
        abnormalFrames,
        lyingSeconds,
        fallLikeTransition,
        eventStarted
      };
    }

    // Lazy load MediaPipe Pose model
    async function initLocalPose() {
      if (localPose) return;
      
      const hintEl = $("cameraTestHint");
      if (hintEl) hintEl.textContent = "Đang khởi tạo thư viện AI Pose (MediaPipe)...";
      
      return new Promise((resolve, reject) => {
        try {
          if (typeof window.Pose === "undefined") {
            throw new Error("Không thể tải MediaPipe Pose. Kiểm tra lại kết nối Internet.");
          }
          localPose = new window.Pose({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
          });
          localPose.setOptions({
            modelComplexity: 1,
            smoothLandmarks: true,
            enableSegmentation: false,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
          });
          localPose.onResults(onPoseResults);
          resolve();
        } catch (err) {
          console.error("Lỗi khởi tạo MediaPipe Pose:", err);
          reject(err);
        }
      });
    }

    // Local Pose Callback
    function onPoseResults(results) {
      const canvasElement = document.getElementById("testCameraCanvas");
      if (!canvasElement) return;
      const canvasCtx = canvasElement.getContext("2d");
      
      canvasElement.style.display = "block";
      
      // Update canvas dimensions to match video frame
      if (canvasElement.width !== results.image.width || canvasElement.height !== results.image.height) {
        canvasElement.width = results.image.width;
        canvasElement.height = results.image.height;
      }
      
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      
      if (results.poseLandmarks) {
        // Hide simulation CSS person
        document.querySelectorAll(".person").forEach((p) => p.style.display = "none");
        
        // Draw bones using MediaPipe utils
        if (window.drawConnectors && window.drawLandmarks) {
          window.drawConnectors(canvasCtx, results.poseLandmarks, window.POSE_CONNECTIONS, {
            color: "#4ade80",
            lineWidth: 4
          });
          window.drawLandmarks(canvasCtx, results.poseLandmarks, {
            color: "#f87171",
            lineWidth: 2,
            radius: 5
          });
        }

        // Draw bounding box (Khung nhận diện người) and pose status
        if (results.poseLandmarks) {
          let minX = 1.0, maxX = 0.0, minY = 1.0, maxY = 0.0;
          results.poseLandmarks.forEach(kp => {
            if (kp.x < minX) minX = kp.x;
            if (kp.x > maxX) maxX = kp.x;
            if (kp.y < minY) minY = kp.y;
            if (kp.y > maxY) maxY = kp.y;
          });
          
          const padX = (maxX - minX) * 0.15;
          const padY = (maxY - minY) * 0.15;
          minX = Math.max(0, minX - padX);
          maxX = Math.min(1, maxX + padX);
          minY = Math.max(0, minY - padY);
          maxY = Math.min(1, maxY + padY);
          
          const activeCam = cameraById(selectedCameraId) || { state: "normal" };
          const isFallen = activeCam.state === "fallen" || activeCam.state === "alert" || aiFallTestOn;
          canvasCtx.strokeStyle = isFallen ? "#f43f5e" : "#10b981";
          canvasCtx.lineWidth = 3;
          canvasCtx.strokeRect(
            minX * canvasElement.width, 
            minY * canvasElement.height, 
            (maxX - minX) * canvasElement.width, 
            (maxY - minY) * canvasElement.height
          );
          
          // Draw label: Đứng / Ngồi / Đi / Nằm / Té ngã
          let labelText = "ĐỨNG";
          if (isFallen) {
            labelText = "TÉ NGÃ";
          } else if (activeCam.state === "lying" || activeCam.state === "possible_fall") {
            labelText = "NẰM";
          } else if (activeCam.state === "sitting") {
            labelText = "NGỒI";
          } else if (activeCam.state === "walking") {
            labelText = "ĐI";
          }
          
          canvasCtx.fillStyle = isFallen ? "#f43f5e" : "#10b981";
          canvasCtx.font = "bold 16px Arial";
          canvasCtx.fillText(labelText, minX * canvasElement.width, Math.max(20, minY * canvasElement.height - 8));
        }
        
        // Run detection rules
        const detection = updateDetector(results.poseLandmarks);
        if (detection) {
          updateLocalMetricsUI(detection);
          if (detection.eventStarted) {
            triggerLocalFallAlert(detection);
          }
        }
      } else {
        updateLocalNoPoseUI();
      }
    }

    // Frame loops using requestAnimationFrame
    async function processWebcamFrame() {
      if (!isProcessingLocalCamera || !testCameraStream) return;
      const video = document.getElementById("testCameraVideo");
      if (video && video.readyState === video.HAVE_ENOUGH_DATA) {
        if (localPose) {
          try {
            await localPose.send({ image: video });
          } catch (e) {
            console.error("Lỗi gửi frame lên MediaPipe:", e);
          }
        }
      }
      requestAnimationFrame(processWebcamFrame);
    }

    // Update UI Metrics panel for Local detection
    function updateLocalMetricsUI(det) {
      const stateUpper = det.state.toUpperCase();
      let statusText = "NORMAL";
      let confidence = "18%";
      
      if (stateUpper === "ALERT" || stateUpper === "FALLEN") {
        statusText = "FALL";
        confidence = `${Math.min(99, Math.round(70 + det.torsoAngle / 2))}%`;
      } else if (["POSSIBLE_FALL", "WARNING", "LYING", "WARNING"].includes(stateUpper)) {
        statusText = "WARNING";
        confidence = "81%";
      }
      
      const torso = `${det.torsoAngle.toFixed(1)}°`;
      const lying = `${det.lyingSeconds.toFixed(1)}s`;
      const hip = `${Math.abs(det.hipVelocity * 10).toFixed(2)} m/s`;
      
      if ($("metricState")) $("metricState").innerHTML = statusPill(statusText);
      if ($("metricConfidence")) $("metricConfidence").textContent = confidence;
      if ($("metricTorso")) $("metricTorso").textContent = torso;
      if ($("metricLying")) $("metricLying").textContent = lying;
      if ($("metricHip")) $("metricHip").textContent = hip;
      
      const detailCard = document.querySelector(".live-detail");
      if (detailCard) {
        detailCard.classList.remove("warning", "fallen");
        if (statusText === "FALL") detailCard.classList.add("fallen");
        else if (statusText === "WARNING") detailCard.classList.add("warning");

      const badge = $("liveStateBadge");

      const note = $("liveOverlayNote");
      if (note) {
        note.textContent = statusText === "FALL" ? "CẢNH BÁO TÉ NGÃ" : statusText === "WARNING" ? "Cảnh báo tư thế" : "";
        note.style.display = statusText !== "NORMAL" ? "block" : "none";

      // Update Pipeline tab

        dashboardCard.className = `cam ${statusText === "FALL" ? "fallen" : statusText === "WARNING" ? "warning" : ""}`;

    // Trigger local fall alert
    function triggerLocalFallAlert(det) {
      const cam = cameraById(selectedCameraId);
      const camName = cam ? cam.id : "CAM-LOCAL";
      const now = new Date();
      const timeStr = `${String(now.getDate()).padStart(2, '0')}/${String(now.getMonth() + 1).padStart(2, '0')}/${now.getFullYear()} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      
      // Auto-capture camera snapshot with skeleton overlay
      let capturedMedia = "Ảnh (Browser)";
      const video = document.getElementById("testCameraVideo");
      if (video && video.srcObject && video.videoWidth) {
        try {
          const canvas = document.createElement("canvas");
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(video, 0, 0);
          
          const overlayCanvas = document.getElementById("testCameraCanvas");
          if (overlayCanvas && overlayCanvas.style.display !== "none") {
            ctx.drawImage(overlayCanvas, 0, 0);
          }
          capturedMedia = canvas.toDataURL("image/jpeg", 0.7); // compress to JPEG
        } catch (e) {
          console.error("Lỗi tự động chụp ảnh té ngã:", e);
        }
      }

      const newAlert = {
        id: `AL-${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}-${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}${String(now.getSeconds()).padStart(2,'0')}`,
        time: timeStr,
        camera: camName,
        person: "Người dùng (Webcam khách)",
        confidence: Math.round(70 + det.torsoAngle / 2),
        status: "Chưa xử lý",
        level: "Khẩn cấp",
        media: capturedMedia
      };
      
      alerts.unshift(newAlert);
      saveAll();
      updatePendingAlertsCount();
      
      // Show User Popup Alert or standard admin siren alert
      if (currentUser.role !== "Admin") {
        triggerRealtimeFallAlert(newAlert);
      } else {
        // Play Audio Alarm (Siren sweep)
        playAlarmSound();
        // Show screen alert toast
        toast(`🚨 CẢNH BÁO TÉ NGÃ: Phát hiện tại camera máy khách ${camName}!`);
      }
      
      // Web speech synthesis alert
      if (window.speechSynthesis) {
        try {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance("Cảnh báo. Phát hiện té ngã tại thiết bị máy khách. Vui lòng kiểm tra khẩn cấp!");
          utterance.lang = "vi-VN";
          const voices = window.speechSynthesis.getVoices();

    function triggerBeep() {
      const now = Date.now();
      if (now - lastBeepTime < 3000) return;
      lastBeepTime = now;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        gain.gain.setValueAtTime(0.5, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.8);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.8);
      } catch (e) {
        console.error("Không thể phát âm thanh cảnh báo:", e);
      }
    }

            updateRealtimeMetrics({
              status: data.state.toUpperCase(),
              confidence: `${data.confidence}%`,
              torso: `${data.torso_angle_deg.toFixed(1)}°`,
              lying: `${data.lying_seconds.toFixed(1)}s`,
              hip: `${data.hip_velocity.toFixed(2)} m/s`,
              fps: data.fps
            });
            
            const detailCard = document.querySelector(".live-detail");

              const view = detailCard.querySelector(".cam-view");
              if (view) {
                if (data.state === "fallen" || data.state === "alert") {
                  view.classList.add("ai-test-on");
                } else {
                  view.classList.remove("ai-test-on");
                }
              }
            }
            
            if (data.state === "fallen" || data.state === "alert") {
              triggerBeep();
              syncAlertsAndEvents();
              
              if (!alertActive) {
                alertActive = true;
                playAlarmSound();
                toast(`🚨 CẢNH BÁO TÉ NGÃ: Phát hiện tại camera máy chủ!`);
                if (window.speechSynthesis) {
                  try {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance("Cảnh báo. Phát hiện té ngã tại thiết bị máy chủ. Vui lòng kiểm tra khẩn cấp!");

    function startSimulatedPolling() {
      stopStatusPolling();
      simLyingSeconds = 0;
      statusPollingInterval = setInterval(() => {
        const metricsPanel = $("liveMetricsPanel");
        if (!metricsPanel && currentView !== "detection" && currentView !== "dashboard") return;
        
        let status = "NORMAL";
        let confidence = "18%";
        let torso = "12°";
        let lying = "0.0s";
        let hip = "0.10 m/s";
        
        const detailCard = document.querySelector(".live-detail");
        
        if (aiFallTestOn) {
          simLyingSeconds += 0.5;
          status = "FALL";
          confidence = "94%";
          torso = `${(82 + Math.random() * 5).toFixed(1)}°`;
          lying = `${simLyingSeconds.toFixed(1)}s`;
          hip = simLyingSeconds < 2 ? "1.82 m/s" : "0.00 m/s";
          
          if (detailCard) {
            detailCard.classList.remove("warning");
            detailCard.classList.add("fallen");
          }
        } else {
          simLyingSeconds = 0;
          const rAngle = 8 + Math.sin(Date.now() / 2000) * 5;
          const rVelocity = 0.08 + Math.cos(Date.now() / 1500) * 0.05;
          status = rAngle > 12 ? "WARNING" : "NORMAL";
          confidence = `${Math.round(15 + Math.random() * 5)}%`;
          torso = `${rAngle.toFixed(1)}°`;
          lying = "0.0s";
          hip = `${rVelocity.toFixed(2)} m/s`;
          
          if (detailCard) {
            detailCard.classList.remove("fallen");
            if (rAngle > 12) {
              detailCard.classList.add("warning");
            } else {
              detailCard.classList.remove("warning");
            }
          }
        }
        
        updateRealtimeMetrics({ status, confidence, torso, lying, hip, fps: 30 });
      }, 500);
    }

    async function syncAlertsAndEvents() {
      if (!isBackendOnline || !authToken) return;
      try {
        const alertsRes = await fetch(`${apiBaseUrl()}/api/alerts`, {
          headers: { Authorization: `Bearer ${authToken}` }
        });
        if (alertsRes.ok) {
          const data = await alertsRes.json();
          if (data.alerts && data.alerts.length > 0) {
            let changed = false;
            data.alerts.forEach(backendAlert => {
              const localIndex = alerts.findIndex(a => a.id === backendAlert.id);
              if (localIndex < 0) {
                alerts.unshift(backendAlert);
                changed = true;
                
                if (backendAlert.status === "Chưa xử lý" && currentUser.role !== "Admin") {
                  triggerRealtimeFallAlert(backendAlert);
                }
              } else {
                const local = alerts[localIndex];
                if (local.cloud_img_url !== backendAlert.cloud_img_url || local.cloud_video_url !== backendAlert.cloud_video_url || local.status !== backendAlert.status) {
                  alerts[localIndex] = { ...local, ...backendAlert };
                  changed = true;
                }
              }
            });
            if (changed) {
              saveAll();
              updatePendingAlertsCount();
              if (currentView === "alerts" || currentView === "media" || currentView === "user_alerts" || currentView === "user_history") {
                render(currentView, false);
              }
            }
          }
        }
      } catch (e) {
        console.error("Lỗi đồng bộ alerts:", e);
      }
    }

    async function fetchBackendEvents() {
      if (!isBackendOnline || !authToken) return;
      try {
        const res = await fetch(`${apiBaseUrl()}/api/events`, {
          headers: { Authorization: `Bearer ${authToken}` }
        });
        if (res.ok) {
          const data = await res.json();
          if (data.events) {
            backendEvents = data.events;
            const container = $("eventsTableContainer");
            if (container) {
              const rows = backendEvents.map(e => {
                const timeStr = e.timestamp ? e.timestamp.replace("T", " ") : "N/A";
                const level = e.state === "alert" || e.state === "fallen" ? "Khẩn cấp" : "Cảnh báo";
                return [
                  timeStr,
                  `Phát hiện AI: ${e.state} (Góc: ${e.torso_angle_deg}°, Nằm: ${e.lying_seconds}s)`,
                  "CAM-LOCAL",
                  "BN-LOCAL",
                  statusPill(level),
                  statusPill("Đã ghi log")
                ];
              });
              container.innerHTML = table(["Thời gian", "Sự kiện", "Camera", "Đối tượng", "Mức độ", "Trạng thái"], rows);
            }
          }
        }
      } catch (e) {
        console.error("Lỗi tải sự kiện:", e);
      }
    }

    function updatePendingAlertsCount() {
      const visCamIds = getVisibleCameras().map(c => c.id);
      const isPrivileged = currentUser.role === "Admin" || currentUser.role === "Quản lý";
      const pendingCount = alerts.filter(a => a.status === "Chưa xử lý" && (isPrivileged || visCamIds.includes(a.camera))).length;
      const badge = $("pendingAlertsBadge");
      if (badge) {
        badge.textContent = `${pendingCount} cảnh báo chờ`;
        badge.style.display = pendingCount > 0 ? "inline-flex" : "none";
      }
      
      const navAlertBadge = document.querySelector("[data-view='alerts'] .badge") || document.querySelector("[data-view='user_alerts'] .badge");
      if (navAlertBadge) {
        navAlertBadge.textContent = pendingCount;
        navAlertBadge.style.display = pendingCount > 0 ? "inline-block" : "none";
      }
    }


    function buildNav() {
      const isUser = currentUser.role !== "Admin";
      const currentMenu = menu;

      $("nav").innerHTML = currentMenu.map(([section, items]) => 
        `<div class="nav-section">${section}</div>${items.map(([id, icon, label]) => {
          let badgeHtml = "";
          if (id === "alerts" || id === "user_alerts") {
            badgeHtml = '<span class="badge" id="alertNavBadge">0</span>';
          } else if (id === "user_notifications") {
            badgeHtml = '<span class="badge" id="notifNavBadge" style="background:var(--blue)">0</span>';
          }
          return `<button data-view="${id}"><span>${icon}</span><span>${label}</span>${badgeHtml}</button>`;
        }).join("")}`
      ).join("");
      
      document.querySelectorAll("[data-view]").forEach(btn => btn.addEventListener("click", () => {
        const viewId = btn.dataset.view;
        if (viewId === "live") liveViewLevel = "locations";
        if (viewId === "user_dashboard") liveViewLevel = "cameras";
        if (viewId === "dashboard") liveViewLevel = "cameras";
        if (viewId === "alerts") alertsViewLevel = "locations";
        if (viewId === "media") mediaViewLevel = "locations";
        render(viewId);
      }));
    }


    function render(id = "dashboard", fetchSync = true) {
      // Tắt camera khi rời khỏi màn hình giám sát trực tiếp
      const isLiveView = (id === "user_dashboard" || id === "live");
      if (!isLiveView || liveViewLevel !== "stream") {
        stopTestCamera(false);
      }

      const vis = getVisibleCameras();
      if (vis.length > 0) {
        if (!vis.some(c => c.id === selectedCameraId)) {
          selectedCameraId = vis[0].id;
        }
      } else {
        selectedCameraId = "";
      }
      
      const isUser = currentUser.role !== "Admin";
      const currentMenu = menu;
      const item = currentMenu.flatMap(m => m[1]).find(i => i[0] === id) || currentMenu[0][1][0];
      id = item[0];
      currentView = id;
      
      $("pageTitle").textContent = item[2];
      $("pageSub").textContent = item[3];
      $("content").innerHTML = views[id]();
      document.querySelectorAll("[data-view]").forEach(btn => btn.classList.toggle("active", btn.dataset.view === id));
      
      attachTestCameraStream();
      updatePendingAlertsCount();

      // Fetch dynamic logs when rendering events
      if (id === "events") {
        fetchBackendEvents();
      }

      // Sync alerts from backend automatically when viewing alerts or media
      if (fetchSync && (id === "alerts" || id === "media" || id === "user_alerts" || id === "user_history")) {
        syncAlertsAndEvents();
      }
      
      // Auto-start status polling on detection tab or user dashboard if stream is active
      const shouldPoll = id === "detection" || (id === "user_live" && liveViewLevel === "stream");
      if (shouldPoll && (testCameraStream || (isBackendOnline && authToken))) {
        if (isBackendOnline) startStatusPolling(); else startSimulatedPolling();
      }
      
      if (isUser) {
        updateNotificationsBadge();
      }

      // Dynamic header adjustments for User role
      const pill = document.getElementById("backendStatusPill");
      const notifyBtn = document.querySelector("[data-action='notify']");
      const pendingAlertsBadge = document.getElementById("pendingAlertsBadge");
      let callBtn = document.getElementById("callEmergencyBtn");
      
      if (isUser) {
        if (pill) pill.style.display = "none";
        if (notifyBtn) notifyBtn.style.display = "none";
        if (pendingAlertsBadge) pendingAlertsBadge.style.display = "none";
        
        if (!callBtn) {
          callBtn = document.createElement("button");
          callBtn.id = "callEmergencyBtn";
          callBtn.className = "emergency-hotline-btn";
          callBtn.innerHTML = `
            <span class="phone-icon-wrapper">
              <span class="pulse-ring"></span>
              <span class="phone-icon">📞</span>
            </span>
            <span class="phone-number">0987.654.321</span>
          `;
          
          callBtn.addEventListener("click", () => {
            const confirmed = confirm("Bạn có chắc chắn muốn gọi khẩn cấp tới số 0987.654.321?");
            if (confirmed) {
              window.location.href = "tel:0987654321";
            }
          });
          
          document.querySelector(".top-actions").appendChild(callBtn);
        } else {
          callBtn.style.display = "inline-flex";
        }
      } else {
        if (pill) pill.style.display = "inline-flex";
        if (notifyBtn) notifyBtn.style.display = "inline-flex";
        if (pendingAlertsBadge) pendingAlertsBadge.style.display = "inline-flex";
        if (callBtn) callBtn.style.display = "none";
      }
    }


    function performLogout() {
      stopTestCamera(false);
      if (backendCheckInterval) {
        clearInterval(backendCheckInterval);
        backendCheckInterval = null;
      }
      if (authToken) {
        fetch(`${apiBaseUrl()}/api/auth/logout`, {
          method: "POST",
          headers: { Authorization: `Bearer ${authToken}` }
        }).catch(() => {});
        authToken = "";
        localStorage.removeItem(TOKEN_STORAGE_KEY);
        localStorage.removeItem("nckh_current_user_email");
      }
      window.location.replace("../index.html");
    }

              <div id="mediaDeleteNote-${alertId}" style="display:none; padding:40px; text-align:center; background:#f8fafc; border-radius:8px; border:1px solid var(--line);">
                <div style="font-size:36px; margin-bottom:8px;">🗑️</div>
                <p style="font-weight:600; margin:0 0 4px; color:var(--red);">Hình ảnh / Video không khả dụng</p>
                <p class="hint" style="margin:0;">Nội dung này đã bị xóa trên Cloudinary nên không thể hiển thị.</p>
              </div>
              ${cloudLinkHtml}
            `, `<button class="btn line" data-close-modal>Đóng</button>`);
          }
        } else {
          if (isMock) {
            openModal(`Xem Ảnh chụp ${alertId}`, `
              <div style="background:#1e293b; border-radius:8px; overflow:hidden; aspect-ratio:16/9; display:flex; justify-content:center; align-items:center;">
                <div style="color:#fff; text-align:center; padding: 20px;">
                  <div style="font-size:48px; margin-bottom:10px;">📷</div>
                  <div>Ảnh chụp sự kiện lúc phát hiện té ngã</div>
                  <div class="hint" style="color:#94a3b8; margin-top:5px;">Đã lưu trữ an toàn trên đám mây (Bản ghi mô phỏng)</div>
                </div>
              </div>
            `, `<button class="btn line" data-close-modal>Đóng</button>`);
          } else {
            openModal(`Xem Ảnh chụp ${alertId}`, `
              <img src="${imgSrc}" alt="Snapshot" style="width:100%; border-radius:8px; border:1px solid var(--line)" onerror="this.style.display='none'; document.getElementById('mediaDeleteNote-${alertId}').style.display='block';">
              <div id="mediaDeleteNote-${alertId}" style="display:none; padding:40px; text-align:center; background:#f8fafc; border-radius:8px; border:1px solid var(--line);">
                <div style="font-size:36px; margin-bottom:8px;">🗑️</div>
                <p style="font-weight:600; margin:0 0 4px; color:var(--red);">Hình ảnh / Video không khả dụng</p>
                <p class="hint" style="margin:0;">Nội dung này đã bị xóa trên Cloudinary nên không thể hiển thị.</p>
              </div>
              ${cloudLinkHtml}
            `, `<button class="btn line" data-close-modal>Đóng</button>`);
          }
        }
      }
      if (event.target.closest("[data-action='download-media']")) {
        const alertId = event.target.closest("[data-action='download-media']").dataset.alertId;
        toast(`Đang chuẩn bị tải xuống tệp media cho sự kiện ${alertId}...`);
      }
      if (event.target.closest("[data-action='delete-media']")) {
        const alertId = event.target.closest("[data-action='delete-media']").dataset.alertId;
        if (confirm(`Xóa cảnh báo và tệp media của sự kiện ${alertId}?`)) {
          if (isBackendOnline && authToken) {
            try {
              const res = await fetch(`${apiBaseUrl()}/api/alerts/${encodeURIComponent(alertId)}`, {
                method: "DELETE",
                headers: { Authorization: `Bearer ${authToken}` }
              });
              if (!res.ok) {
                const errData = await res.json().catch(() => ({}));
                alert(errData.detail || "Không thể xóa cảnh báo trên máy chủ.");
                return;
              }
            } catch (err) {
              console.error("Alert delete sync failed:", err);
              alert("Lỗi kết nối khi đồng bộ xóa cảnh báo.");
              return;
            }
          }
          alerts = alerts.filter(a => a.id !== alertId);
          saveAll();
          render(currentView);
          toast(`Đã xóa cảnh báo và tệp media ${alertId}`);
        }
      }
    });

    window.handleCameraFormSubmit = async function(event) {
      event.preventDefault();
      const form = event.target;
      const data = Object.fromEntries(new FormData(form).entries());
      if (!data.oldId && cameras.some(c => c.id.toLowerCase() === data.id.toLowerCase())) {
        alert("Mã camera này đã tồn tại trên hệ thống!");
        return;
      }
      const cam = { id: data.id, name: data.name, ip: data.ip, rtsp: data.rtsp, area: "", target: "", state: data.state, status: data.status, fps: Number(data.fps), resolution: data.resolution, threshold: Number(data.threshold) };
      
      if (isBackendOnline && authToken) {
        try {
          const url = data.oldId 
            ? `${apiBaseUrl()}/api/cameras/${encodeURIComponent(data.oldId)}`
            : `${apiBaseUrl()}/api/cameras`;
          const method = data.oldId ? "PUT" : "POST";
          const res = await fetch(url, {
            method: method,
            headers: { 
              "Content-Type": "application/json",
              Authorization: `Bearer ${authToken}`
            },
            body: JSON.stringify(cam)
          });
          if (!res.ok) {
            const errData = await res.json().catch(() => ({}));
            alert(errData.detail || "Không thể đồng bộ dữ liệu camera lên máy chủ.");
            return;
          }
        } catch (err) {
          console.error("Camera sync failed:", err);
          alert("Lỗi kết nối khi đồng bộ dữ liệu camera.");
          return;
        }
      }

      const idx = cameras.findIndex((item) => item.id === data.oldId);
      if (idx >= 0) cameras[idx] = cam; else cameras.push(cam);
      selectedCameraId = cam.id;
      saveAll();
      closeModal();
      render(currentView);
    };

    window.handleCameraPermissionFormSubmit = async function(event) {
      event.preventDefault();
      const form = event.target;
      const formData = new FormData(form);
      const email = formData.get("email");
      const assignedCameras = formData.getAll("assignedCameras");
      
      const targetUser = users.find(u => u.email === email);
      if (!targetUser) {
        alert("Không tìm thấy thông tin khách hàng!");
        return;
      }

      const updatedUser = {
        ...targetUser,
        assignedCameras: assignedCameras
      };

      if (isBackendOnline && authToken) {
        try {
          const url = `${apiBaseUrl()}/api/users/${encodeURIComponent(email)}`;
          const res = await fetch(url, {
            method: "PUT",
            headers: { 
              "Content-Type": "application/json",
              Authorization: `Bearer ${authToken}`
            },
            body: JSON.stringify(updatedUser)
          });
          if (!res.ok) {
            const errData = await res.json().catch(() => ({}));
            alert(errData.detail || "Không thể đồng bộ phân quyền camera lên máy chủ.");
            return;
          }
        } catch (err) {
          console.error("Camera permission sync failed:", err);
          alert("Lỗi kết nối khi đồng bộ phân quyền camera.");
          return;
        }
      }

      const idx = users.findIndex((item) => item.email === email);
      if (idx >= 0) users[idx] = updatedUser;
      saveAll();
      closeModal();
      render(currentView, false);
    };

    window.handleUserFormSubmit = async function(event) {
      event.preventDefault();
      const form = event.target;
      const formData = new FormData(form);
      const email = formData.get("email")?.trim();
      const oldEmail = formData.get("oldEmail");
      if (!oldEmail && users.some(u => u.email.toLowerCase() === email.toLowerCase())) {
        alert("Tài khoản với email này đã tồn tại trên hệ thống!");
        return;
      }
      if (oldEmail && oldEmail.toLowerCase() === currentUser.email.toLowerCase()) {
        if (formData.get("role") !== currentUser.role) {
          alert("Bạn không thể tự thay đổi vai trò (Role) của chính mình!");
          return;
        }
        if (formData.get("status") !== "Đang hoạt động") {
          alert("Bạn không thể tự thay đổi trạng thái hoạt động của chính mình!");
          return;
        }
      }
      const assignedCameras = formData.getAll("assignedCameras");
      const password = formData.get("password")?.trim();
      const user = { 
        email: email, 
        name: formData.get("name"), 
        role: formData.get("role"), 
        status: formData.get("status"),
        assignedCameras: assignedCameras,
        phone: formData.get("phone")?.trim() || null
      };
      if (password) {
        user.password = password;
      }

      if (isBackendOnline && authToken) {
        try {
          const url = oldEmail 
            ? `${apiBaseUrl()}/api/users/${encodeURIComponent(oldEmail)}`
            : `${apiBaseUrl()}/api/users`;
          const method = oldEmail ? "PUT" : "POST";
          const res = await fetch(url, {
            method: method,
            headers: { 
              "Content-Type": "application/json",
              Authorization: `Bearer ${authToken}`
            },
            body: JSON.stringify(user)
          });
          if (!res.ok) {
            const errData = await res.json().catch(() => ({}));
            alert(errData.detail || "Không thể đồng bộ tài khoản lên máy chủ.");
            return;
          }
        } catch (err) {
          console.error("User sync failed:", err);
          alert("Lỗi kết nối khi đồng bộ tài khoản.");
          return;
        }
      }

      const idx = users.findIndex((item) => item.email === oldEmail);
      const savedUser = { ...user };
      delete savedUser.password;
      if (idx >= 0) users[idx] = savedUser; else users.push(savedUser);
      saveAll();
      closeModal();
      render("users");
    };

    document.addEventListener("submit", async (event) => {
      if (event.target.id === "settingsForm") {
        event.preventDefault();
        const data = Object.fromEntries(new FormData(event.target).entries());
        settings = {
          confidence: Number(data.confidence),
          fall: Number(data.fall),
          confirmSeconds: Number(data.confirmSeconds),
          storageGb: Number(data.storageGb),
          retentionDays: Number(data.retentionDays),
          email: Boolean(data.email),
          telegram: Boolean(data.telegram),
          sms: Boolean(data.sms),
          zalo: Boolean(data.zalo),
          cloud: Boolean(data.cloud),
        };
        saveAll();
        toast("Đã lưu cài đặt hệ thống.");
        render("settings");
      }
      if (event.target.id === "changePasswordForm") {
        event.preventDefault();
        const data = Object.fromEntries(new FormData(event.target).entries());
        if (data.newPassword !== data.confirmPassword) {
          alert("Xác nhận mật khẩu mới không khớp!");
          return;
        }
        
        const targetUserIdx = users.findIndex(u => u.email === currentUser.email);
        if (targetUserIdx !== -1) {
          const updatedUser = { 
            ...users[targetUserIdx],
            password: data.newPassword 
          };
          
          if (isBackendOnline && authToken) {
            try {
              const res = await fetch(`${apiBaseUrl()}/api/users/${encodeURIComponent(currentUser.email)}`, {
                method: "PUT",
                headers: { 
                  "Content-Type": "application/json",
                  Authorization: `Bearer ${authToken}`
                },
                body: JSON.stringify(updatedUser)
              });
              if (!res.ok) {
                const errData = await res.json().catch(() => ({}));
                alert(errData.detail || "Không thể đồng bộ cập nhật mật khẩu lên máy chủ.");
                return;
              }
            } catch (err) {
              console.error("Change password sync failed:", err);
              alert("Lỗi kết nối khi đồng bộ cập nhật mật khẩu.");
              return;
            }
          }
          
          users[targetUserIdx] = updatedUser;
          saveAll();
          toast("Đã đổi mật khẩu thành công!");
          event.target.reset();
        }
      }
      if (event.target.id === "editUserProfileForm") {
        event.preventDefault();
        const data = Object.fromEntries(new FormData(event.target).entries());
        const oldEmail = currentUser.email;
        const newEmail = data.email.trim().toLowerCase();
        
        // Basic email format check
        if (!newEmail.includes("@")) {
          alert("Vui lòng nhập định dạng email hợp lệ.");
          return;
        }
        
        // Check if new email is already taken by another user
        const emailTaken = users.some(u => u.email.toLowerCase() === newEmail && u.email.toLowerCase() !== oldEmail.toLowerCase());
        if (emailTaken) {
          alert("Email này đã được sử dụng bởi tài khoản khác.");
          return;
        }

        const targetUserIdx = users.findIndex(u => u.email.toLowerCase() === oldEmail.toLowerCase());
        if (targetUserIdx !== -1) {
          const updatedUser = { 
            ...users[targetUserIdx],
            name: data.name.trim(),
            email: newEmail,
            phone: data.phone.trim() || null
          };
          
          if (isBackendOnline && authToken) {
            try {
              const res = await fetch(`${apiBaseUrl()}/api/users/${encodeURIComponent(oldEmail)}`, {
                method: "PUT",
                headers: { 
                  "Content-Type": "application/json",
                  Authorization: `Bearer ${authToken}`
                },
                body: JSON.stringify(updatedUser)
              });
              if (!res.ok) {
                const errData = await res.json().catch(() => ({}));
                alert(errData.detail || "Không thể đồng bộ cập nhật thông tin cá nhân lên máy chủ.");
                return;
              }
            } catch (err) {
              console.error("Profile sync failed:", err);
              alert("Lỗi kết nối khi đồng bộ cập nhật thông tin cá nhân.");
              return;
            }
          }
          
          // Migrate local storage avatar, age, gender, address
          if (newEmail !== oldEmail) {
            const avatar = localStorage.getItem(`avatar_${oldEmail}`);
            if (avatar) {
              localStorage.setItem(`avatar_${newEmail}`, avatar);
              localStorage.removeItem(`avatar_${oldEmail}`);
            }
            const ageVal = localStorage.getItem(`profile_age_${oldEmail}`);
            if (ageVal) {
              localStorage.setItem(`profile_age_${newEmail}`, ageVal);
              localStorage.removeItem(`profile_age_${oldEmail}`);
            }
            const genderVal = localStorage.getItem(`profile_gender_${oldEmail}`);
            if (genderVal) {
              localStorage.setItem(`profile_gender_${newEmail}`, genderVal);
              localStorage.removeItem(`profile_gender_${oldEmail}`);
            }
            const addressVal = localStorage.getItem(`profile_address_${oldEmail}`);
            if (addressVal) {
              localStorage.setItem(`profile_address_${newEmail}`, addressVal);
              localStorage.removeItem(`profile_address_${oldEmail}`);
            }
          }
          
          users[targetUserIdx] = updatedUser;
          currentUser = updatedUser;
          localStorage.setItem("nckh_current_user_email", currentUser.email);
          
          // Save additional fields locally for the new email key
          localStorage.setItem(`profile_age_${currentUser.email}`, data.age || "");
          localStorage.setItem(`profile_gender_${currentUser.email}`, data.gender || "");
          localStorage.setItem(`profile_address_${currentUser.email}`, data.address || "");
          
          saveAll();
          updateSidebarFooter();
          toast("Đã cập nhật thông tin cá nhân thành công!");
          render("user_account");
        }
      }
    });



    async function initSession() {
      const savedEmail = localStorage.getItem("nckh_current_user_email");
      if (authToken && savedEmail) {
        const found = users.find(u => u.email.toLowerCase() === savedEmail.toLowerCase());
        if (found && found.status !== "Bị khóa" && found.role === "Admin") {
          currentUser = found;
          updateSidebarFooter();
          buildNav();
          render("dashboard");
          
          const online = await checkBackendStatus();
          if (online) {
            try {
              const res = await fetch(`${apiBaseUrl()}/api/users`, {
                headers: { Authorization: `Bearer ${authToken}` }
              });
              if (res.ok) {
                console.log("Auto-login session verified with backend.");
                await syncFromBackend();
              } else {
                console.warn("Session token expired or invalid.");
                performLogout();
              }
            } catch (err) {
              console.warn("Could not verify session with backend, continuing offline:", err);
            }
          }
          
          backendCheckInterval = setInterval(checkBackendStatus, 5000);
          return;
        }
      }
      window.location.replace("../index.html");
    }

    // Responsive sidebar toggle logic
    document.getElementById("menuToggleBtn").addEventListener("click", () => {
      document.querySelector(".sidebar").classList.add("active");
      document.getElementById("sidebarOverlay").classList.add("active");
    });
    document.getElementById("sidebarOverlay").addEventListener("click", () => {
      document.querySelector(".sidebar").classList.remove("active");
      document.getElementById("sidebarOverlay").classList.remove("active");
    });
    document.querySelector(".sidebar").addEventListener("click", (e) => {
      if (e.target.closest("button")) {
        document.querySelector(".sidebar").classList.remove("active");
        document.getElementById("sidebarOverlay").classList.remove("active");
      }
    });

    initSession();
  </script>
