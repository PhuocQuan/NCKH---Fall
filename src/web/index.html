<!DOCTYPE html>
<html lang="vi">
<head>
  <script>
    function checkRedirect() {
      if (/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || window.innerWidth < 768) {
        window.location.replace("mobile/index.html" + window.location.search);
      }
    }
    checkRedirect();
    window.addEventListener('resize', checkRedirect);
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FallGuard AI - Dashboard NCKH</title>
  <link rel="stylesheet" href="shared/dashboard.css" />
  <style>
    /* Keyframes and Animations */
    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.5; box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
      70% { transform: scale(1); opacity: 1; box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
      100% { transform: scale(0.95); opacity: 0.5; box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }
    @keyframes pulse-red {
      0% { transform: scale(0.95); opacity: 0.5; box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
      70% { transform: scale(1); opacity: 1; box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); }
      100% { transform: scale(0.95); opacity: 0.5; box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    @keyframes pulse-warning {
      0% { transform: scale(0.95); opacity: 0.5; box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.4); }
      70% { transform: scale(1); opacity: 1; box-shadow: 0 0 0 6px rgba(245, 158, 11, 0); }
      100% { transform: scale(0.95); opacity: 0.5; box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
    }
    
    .status-dot-pulse {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 6px;
    }
    .status-dot-pulse.online {
      background-color: #10b981;
      animation: pulse 2s infinite;
    }
    .status-dot-pulse.offline {
      background-color: #ef4444;
      animation: pulse-red 2s infinite;
    }
    .status-dot-pulse.maintenance {
      background-color: #f59e0b;
      animation: pulse-warning 2s infinite;
    }

    /* Premium Camera Grid and Cards */
    .premium-camera-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .premium-camera-card {
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .premium-camera-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      border-color: #818cf8;
    }
    .location-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 20px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -2px rgba(0, 0, 0, 0.04) !important;
      border-color: #818cf8 !important;
    }
    .premium-camera-card .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid #f1f5f9;
      padding-bottom: 10px;
    }
    .premium-camera-card .card-title {
      font-size: 15px;
      font-weight: 700;
      color: #1e293b;
      margin: 0;
    }
    .premium-camera-card .card-subtitle {
      font-size: 12px;
      color: #64748b;
      margin-top: 2px;
    }
    .premium-camera-card .conn-info {
      background: #f8fafc;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .premium-camera-card .conn-info-row {
      display: flex;
      justify-content: space-between;
    }
    .premium-camera-card .conn-info-label {
      color: #64748b;
    }
    .premium-camera-card .conn-info-value {
      font-weight: 600;
      color: #334155;
      font-family: monospace;
      word-break: break-all;
    }
    .premium-camera-card .param-badges {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      text-align: center;
    }
    .premium-camera-card .param-badge {
      background: #f1f5f9;
      border-radius: 6px;
      padding: 6px 4px;
      font-size: 11px;
    }
    .premium-camera-card .param-badge-label {
      color: #64748b;
      display: block;
      margin-bottom: 2px;
    }
    .premium-camera-card .param-badge-val {
      font-weight: 700;
      color: #0f172a;
    }
    .premium-camera-card .card-actions {
      margin-top: auto;
      display: flex;
      gap: 8px;
      border-top: 1px solid #f1f5f9;
      padding-top: 12px;
    }
    .premium-camera-card .card-actions button {
      flex: 1;
    }
    
    /* Logs pagination classes */
    .pagination-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid var(--line);
    }
    .pagination-controls {
      display: flex;
      gap: 4px;
    }
    .pagination-btn {
      min-width: 36px;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      background: #fff;
      border: 1px solid var(--line);
      color: var(--gray-700);
      transition: all 0.2s;
    }
    .pagination-btn:hover:not(:disabled) {
      background: #f1f5f9;
      border-color: #cbd5e1;
    }
    .pagination-btn.active {
      background: #4f46e5;
      color: #fff;
      border-color: #4f46e5;
    }
    .pagination-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Emergency Hotline Button Custom Styles */
    .emergency-hotline-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #ef4444; /* red-500 */
      color: #fff;
      border: none;
      border-radius: 9999px;
      padding: 4px 16px 4px 4px;
      font-weight: 700;
      font-size: 15px;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
      transition: all 0.2s ease-in-out;
      position: relative;
      overflow: visible;
      outline: none;
    }
    .emergency-hotline-btn:hover {
      background: #dc2626; /* red-600 */
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(239, 68, 68, 0.4);
    }
    .phone-icon-wrapper {
      position: relative;
      width: 28px;
      height: 28px;
      background: #fff;
      color: #ef4444;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 13px;
      z-index: 2;
    }
    .phone-icon-wrapper .phone-icon {
      transform: scaleX(-1); /* reverse telephone direction to match image */
      display: inline-block;
    }
    /* Pulse ring animation */
    .pulse-ring {
      position: absolute;
      top: -4px;
      left: -4px;
      right: -4px;
      bottom: -4px;
      border: 2px solid rgba(239, 68, 68, 0.5);
      border-radius: 50%;
      animation: pulse-wave 1.5s infinite ease-out;
      pointer-events: none;
      z-index: 1;
    }
    @keyframes pulse-wave {
      0% {
        transform: scale(0.9);
        opacity: 1;
      }
      100% {
        transform: scale(1.6);
        opacity: 0;
      }
    }
    .phone-number {
      letter-spacing: 0.5px;
      margin-left: 2px;
    }

    /* Premium Contact and Profile styling */
    .premium-profile-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 10px 15px -3px rgba(0, 0, 0, 0.03);
    }
    .profile-heading {
      font-size: 18px;
      font-weight: 800;
      color: #0f172a;
      border-left: 4px solid var(--blue);
      padding-left: 10px;
      margin-bottom: 20px;
      margin-top: 5px;
    }
    .premium-input-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    @media (max-width: 768px) {
      .premium-input-grid {
        grid-template-columns: 1fr;
      }
    }
    .premium-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .premium-field span {
      font-size: 13px;
      font-weight: 700;
      color: #475569;
    }
    .premium-control {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 12px 16px;
      background: #f8fafc;
      color: #0f172a;
      font-size: 14px;
      transition: all 0.2s ease-in-out;
    }
    .premium-control:focus {
      outline: none;
      border-color: var(--blue);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
    }
    .premium-control:disabled {
      background: #f1f5f9;
      color: #94a3b8;
      cursor: not-allowed;
    }
    
    /* Emergency Contacts styling */
    .contact-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
      margin-top: 20px;
    }
    .contact-card-premium {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .contact-card-premium:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.05);
      border-color: #cbd5e1;
    }
    .contact-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid #f1f5f9;
      padding-bottom: 12px;
    }
    .contact-avatar-badge {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .contact-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #e0e7ff;
      color: var(--blue);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 16px;
      font-weight: 800;
    }
    .contact-name-info {
      display: flex;
      flex-direction: column;
    }
    .contact-name-info h4 {
      margin: 0;
      font-size: 16px;
      font-weight: 800;
      color: #0f172a;
    }
    .contact-relation-pill {
      display: inline-block;
      align-self: flex-start;
      font-size: 10px;
      font-weight: 700;
      color: var(--blue);
      background: #e0e7ff;
      padding: 2px 8px;
      border-radius: 6px;
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .contact-delete-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #fff5f5;
      color: #ef4444;
      border: none;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 18px;
      font-weight: bold;
      transition: all 0.2s;
    }
    .contact-delete-btn:hover {
      background: #fee2e2;
      transform: scale(1.1);
    }
    .contact-body {
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 13px;
      color: #475569;
    }
    .contact-info-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .contact-info-icon {
      color: #64748b;
      font-size: 14px;
      width: 18px;
    }
    .contact-info-value {
      font-weight: 600;
      color: #1e293b;
    }
    .contact-actions {
      display: flex;
      gap: 10px;
      margin-top: auto;
      border-top: 1px solid #f1f5f9;
      padding-top: 16px;
    }
    .contact-btn-call {
      flex: 1;
      height: 42px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 750;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #fff;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease-in-out;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
    }
    .contact-btn-call:hover {
      background: linear-gradient(135deg, #059669 0%, #047857 100%);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(16, 185, 129, 0.3);
    }
    .contact-btn-alert {
      flex: 1;
      height: 42px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 750;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      color: #fff;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease-in-out;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.15);
    }
    .contact-btn-alert:hover {
      background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(239, 68, 68, 0.25);
    }
  </style>

</head><body>
  <section class="login" id="loginScreen">
    <form class="login-card" id="loginForm">
      <div class="brand">
        <div class="brand-mark">AI</div>
        <div>
          <div class="brand-title">FallGuard AI</div>
          <div class="brand-sub">Hệ thống phát hiện té ngã cho đề tài NCKH</div>
        </div>
      </div>
      <label class="field"><span>Tài khoản</span><input class="control" id="loginUsername" value="admin" required /></label>
      <label class="field">
        <span>Mật khẩu</span>
        <div style="position: relative; display: flex; align-items: center; width: 100%;">
          <input class="control" id="loginPassword" type="password" value="nckh2025" style="padding-right: 36px; width: 100%;" required />
          <button type="button" class="password-toggle" onclick="const input = document.getElementById('loginPassword'); if(input.type === 'password') { input.type = 'text'; this.textContent = '👁️'; } else { input.type = 'password'; this.textContent = '🙈'; }">🙈</button>
        </div>
      </label>
      <div class="row" style="margin-bottom:14px">
        <label class="hint"><input type="checkbox" checked /> Ghi nhớ đăng nhập</label>
        <button type="button" class="btn small line" id="forgotBtn" onclick="alert('Vui lòng liên hệ quản trị viên qua email admin@nckh.vn để được hỗ trợ cấp lại mật khẩu.')">Quên mật khẩu</button>
      </div>
      <button class="btn primary block" type="submit">Đăng nhập</button>
      <p class="hint">Demo phân quyền: Admin, Quản lý, Nhân viên y tế, Người thân và Khách xem báo cáo. Dữ liệu trong trang này là dữ liệu mẫu để bảo vệ giao diện NCKH.</p>
    </form>
  </section>

  <script>
    function loadStore(key, fallback) {
      try { return JSON.parse(localStorage.getItem(key)) || fallback; } catch { return fallback; }
    }
    function saveStore(key, value) {
      localStorage.setItem(key, JSON.stringify(value));
    }

    let users = loadStore("fg_users", [
      { email: "admin@nckh.vn", name: "Admin NCKH", role: "Admin", status: "Đang hoạt động", assignedCameras: ["CAM-001", "CAM-002", "CAM-003", "CAM-004", "CAM-005", "CAM-006"] },
      { email: "bao@nckh.vn", name: "Bảo", role: "Khachhang", status: "Đang hoạt động", assignedCameras: ["CAM-001", "CAM-002", "CAM-003", "CAM-004", "CAM-005", "CAM-006"] },
      { email: "nurse@nckh.vn", name: "Nhân", role: "Khachhang", status: "Đang hoạt động", assignedCameras: [] },
      { email: "family@nckh.vn", name: "Ân", role: "Khachhang", status: "Đang hoạt động", assignedCameras: [] },
      { email: "guest@nckh.vn", name: "Quân", role: "Khachhang", status: "Bị khóa", assignedCameras: [] }
    ]);

    const TOKEN_STORAGE_KEY = "nckh_auth_token";
    let authToken = localStorage.getItem(TOKEN_STORAGE_KEY) || "";
    let isBackendOnline = false;

    function apiBaseUrl() {
      return "";
    }

    async function checkBackendStatus() {
      try {
        const res = await fetch(`${apiBaseUrl()}/api/health`);
        const data = await res.json();
        isBackendOnline = data.ok && data.db_connected;
        return isBackendOnline;
      } catch {
        isBackendOnline = false;
        return false;
      }
    }

    $("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      let usernameInput = $("loginUsername")?.value?.trim() || "";
      let passwordInput = $("loginPassword")?.value || "";
      
      const lowerUser = usernameInput.toLowerCase();
      if (!lowerUser.includes("@")) {
        if (lowerUser === "admin") usernameInput = "admin@nckh.vn";
        else if (lowerUser === "manager" || lowerUser === "bao") usernameInput = "bao@nckh.vn";
        else if (lowerUser === "nurse") usernameInput = "nurse@nckh.vn";
        else if (lowerUser === "family") usernameInput = "family@nckh.vn";
        else if (lowerUser === "guest") usernameInput = "guest@nckh.vn";
        else usernameInput = usernameInput + "@nckh.vn";
      }
      
      await checkBackendStatus();
      
      let authenticated = false;
      if (isBackendOnline) {
        try {
          const res = await fetch(`${apiBaseUrl()}/api/auth/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: usernameInput, password: passwordInput }),
          });
          const payload = await res.json().catch(() => ({}));
          if (!res.ok) {
            alert(payload.detail || "Sai tài khoản hoặc mật khẩu.");
            return;
          }
          authToken = payload.token;
          localStorage.setItem(TOKEN_STORAGE_KEY, authToken);
          localStorage.setItem("nckh_server_url", apiBaseUrl());
          
          // Fetch remote users
          const usersRes = await fetch(`${apiBaseUrl()}/api/users`, {
            headers: { Authorization: `Bearer ${authToken}` }
          });
          if (usersRes.ok) {
            const remoteUsers = await usersRes.json();
            if (Array.isArray(remoteUsers)) {
              users = remoteUsers;
              saveStore("fg_users", users);
            }
          }
          authenticated = true;
        } catch (err) {
          console.error("Backend auth failed, trying local fallback:", err);
        }
      }
      
      const foundUser = users.find(u => u.email.toLowerCase() === usernameInput.toLowerCase());
      if (!foundUser) {
        alert("Tài khoản không tồn tại trên hệ thống.");
        return;
      }
      if (foundUser.status === "Bị khóa") {
        alert("Tài khoản của bạn đã bị khóa. Vui lòng liên hệ Admin.");
        return;
      }
      
      if (!authenticated) {
        if (passwordInput !== "nckh2025") {
          alert("Sai mật khẩu. Vui lòng thử lại.");
          return;
        }
      }
      
      localStorage.setItem("nckh_current_user_email", foundUser.email);
      
      if (foundUser.role === "Admin") {
        window.location.replace("/admin/index.html");
      } else {
        window.location.replace("/user/index.html");
      }
    });

    async function initSession() {
      const savedEmail = localStorage.getItem("nckh_current_user_email");
      if (authToken && savedEmail) {
        const found = users.find(u => u.email.toLowerCase() === savedEmail.toLowerCase());
        if (found && found.status !== "Bị khóa") {
          if (found.role === "Admin") {
            window.location.replace("/admin/index.html");
          } else {
            window.location.replace("/user/index.html");
          }
          return;
        }
      }
    }

    function $(id) {
      return document.getElementById(id);
    }

    initSession();
  </script>
</body>
</html>
