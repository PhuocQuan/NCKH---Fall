name: Build and Release Apps

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch: # Cho phép chạy thủ công

jobs:
  build-and-release:
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        working-directory: app_fall
        run: flutter pub get

      - name: Build Android APK
        working-directory: app_fall
        run: flutter build apk --release

      - name: Build unsigned iOS app
        working-directory: app_fall
        run: flutter build ios --release --no-codesign

      - name: Create iOS Payload and IPA
        working-directory: app_fall/build/ios/iphoneos
        run: |
          mkdir -p Payload
          mv Runner.app Payload/
          zip -qq -r FallGuard.ipa Payload

      - name: Upload Artifacts to Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: |
            app_fall/build/app/outputs/flutter-apk/app-release.apk
            app_fall/build/ios/iphoneos/FallGuard.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
