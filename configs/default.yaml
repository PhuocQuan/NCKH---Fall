detector:
  torso_fall_angle_deg: 52
  torso_upright_angle_deg: 32
  head_hip_height_ratio: 0.25
  hip_drop_velocity: 0.025
  angle_change_velocity_deg: 14
  min_fall_frames: 5
  warning_frames: 2
  alert_after_seconds: 1.5
  alert_on_long_lying_without_fall: true
  assumed_fps: 20
  cooldown_frames: 30
  profile: default

app:
  camera_width: 1280
  camera_height: 720
  model_complexity: 1
  draw_landmarks: false
  event_log_path: data/events.csv


ai:
  enabled: false
  model_path: models/fall_classifier.joblib
  alert_probability: 0.70
  smoothing_frames: 5

face:
  enabled: true
  known_faces_dir: data/known_faces
  similarity_threshold: 0.35
  score_threshold: 0.65
  process_every_n_frames: 2






