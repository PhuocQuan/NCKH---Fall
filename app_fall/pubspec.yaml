name: app_fall
description: "FallGuard AI - Ứng dụng client giám sát té ngã."
publish_to: 'none'

version: 1.0.2+3

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # HTTP client for REST API calls
  http: ^1.2.2

  # Local persistence: token, server URL, cached state
  shared_preferences: ^2.3.2

  # MJPEG live stream display (custom implementation using http)
  # Note: flutter_mjpeg 2.x requires http <1.0.0 which conflicts — using custom viewer

  # Date/time formatting (Vietnamese locale)
  intl: ^0.19.0

  # Open phone dialer for emergency contacts
  url_launcher: ^6.3.1
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
